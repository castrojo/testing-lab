# KDE lane integration pins.
#
# This file holds Renovate-managed workflow images and tool versions used by
# the KDE Linux build/publish/QA integration in this repo. Moving KDE source
# advancement (MR !534 and later master on invent.kde.org) is owned by the
# kde-source-tracker CronWorkflow and must not be covered by Renovate.
#
# Format mirrors the shared projectbluefin/renovate-config regex manager for
# image-versions*.yaml files.

images:
  # Shared lab-runner image used by the KDE source tracker and KDE QA steps.
  - name: lab-runner
    image: ghcr.io/projectbluefin/lab-runner
    tag: latest
    digest: sha256:fe097bb3b85a126b9a16093fbc498b4b6fb7b24e0f74162ad3d91a402dcfa940
