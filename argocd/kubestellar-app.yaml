apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubestellar
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/part-of: lab
spec:
  project: default
  source:
    repoURL: ghcr.io/kubestellar/kubestellar
    chart: core-chart
    targetRevision: 0.30.0
    helm:
      valuesObject:
        # its1 type host reuses ghost's API server (OCM hub in-cluster).
        # wds1 is a KubeFlex-hosted API server ArgoCD writes workloads to.
        ITSes:
          - name: its1
            type: host
        WDSes:
          - name: wds1
        # The chart's hook-based postgres install Job (helm.sh/hook:
        # post-install) deadlocks under ArgoCD: PostSync never fires while
        # kubeflex-controller-manager's wait-postgresql init blocks the sync
        # from becoming healthy. PostgreSQL is a separate Application
        # (kubestellar-postgres-app.yaml) with release name "postgres" so the
        # operator's readiness wait on postgres-postgresql-0 matches.
        kubeflex-operator:
          installPostgreSQL: false
        # External reachability deferred per ADR-0004: in-cluster Service
        # DNS suffices until external WECs exist. KubeFlex-generated nginx
        # Ingress objects are inert (no controller claims them).
        #
        # 0.30.0 carries KubeFlex v0.9.3. Verify the controller's status-update
        # behavior after rollout; if conflicts persist, escalate the upstream
        # KubeFlex controller rather than installing an unrelated ingress.
  destination:
    server: https://kubernetes.default.svc
    namespace: kubestellar
  # KubeFlex expands the hook templates after creation. Treat that
  # controller-owned field as runtime state so the app-of-apps wave can settle.
  ignoreDifferences:
    - group: tenancy.kflex.kubestellar.org
      kind: PostCreateHook
      jsonPointers:
        - /spec/templates
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
