# KubeStellar Console — the control GUI for the home control plane
# (ADR-0003). Reconciled by the kubestellar-applications parent Application.
#
# Exposure policy (locked decision): dev-mode (anonymous cluster-admin UI)
# NEVER ships exposed. This install is ClusterIP-only with ingress disabled —
# reachable exclusively via kubectl port-forward:
#   kubectl -n kubestellar-console port-forward svc/kubestellar-console 8080:8080
# Before ANY ingress/Gateway exposure, wire GitHub OAuth: create a GitHub
# OAuth app, put client id/secret in a Secret referenced by
# github.existingSecret, and keep auth.allowedGitHubLogins tight.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubestellar-console
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/part-of: lab
spec:
  project: default
  source:
    repoURL: https://kubestellar.github.io/console
    chart: kubestellar-console
    targetRevision: 0.3.34
    helm:
      valuesObject:
        # local-path is RWO; chart defaults to RWX. Single replica +
        # Recreate avoids the RWO RollingUpdate mount deadlock the chart
        # documents.
        persistence:
          accessModes:
            - ReadWriteOnce
        # Chart's backup PVC hardcodes ReadWriteMany, which local-path
        # cannot provision. Console DB protection is part of the
        # gap-storage-backup ADR scope (Velero user-data-only stance).
        backup:
          enabled: false
        selfUpgrade:
          enabled: false
        rbac:
          resourceQuotasReadOnly: true
        deployment:
          strategy:
            type: Recreate
            rollingUpdate: null
        service:
          type: ClusterIP
        ingress:
          enabled: false
        clusterName: ghost
        consoleProject: kubestellar
        kubeconfig:
          existingSecretKey: config
          content: |
            apiVersion: v1
            kind: Config
            clusters:
              - name: ghost
                cluster:
                  server: https://kubernetes.default.svc
                  certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            contexts:
              - name: ghost
                context:
                  cluster: ghost
                  user: ghost
            current-context: ghost
            users:
              - name: ghost
                user:
                  tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
        enabledDashboards: "dashboard,clusters,cluster-admin,deploy,compute,workloads,deployments,pods,services,nodes,events,gitops,helm,operators,security,storage,network"
        extraEnv:
          - name: ENABLE_DEMO_DASHBOARDS
            value: "false"
          - name: SHOW_DEMO_TO_LOCAL_CTA
            value: "false"
          - name: DISABLE_DYNAMIC_CARDS
            value: "true"
        auth:
          allowedGitHubLogins: castrojo
          adminGitHubLogins: castrojo
  destination:
    server: https://kubernetes.default.svc
    namespace: kubestellar-console
  # ArgoCD renders Helm without cluster access, so the chart's lookup cannot
  # preserve its generated JWT and randAlphaNum changes on every comparison.
  ignoreDifferences:
    - kind: Secret
      name: kubestellar-console
      namespace: kubestellar-console
      jsonPointers:
        - /data/jwt-secret
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
