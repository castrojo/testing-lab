apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: run-container-tests
  namespace: argo
  annotations:
    description: |
      Runs Bluefin BDD suites (smoke, common, developer, software, system)
      inside a nested, systemd-booted target OCI container. The privileged
      Podman host remains Kubernetes-native and bypasses KubeVirt
      virtualization; qecore-headless runs against the nested GDM session.
  labels:
    app.kubernetes.io/component: test-runner
    app.kubernetes.io/part-of: bluefin-test-suite
spec:
  templates:
  - name: run-container-tests
    # GNOME/DRM tests need the physical desktop host. exo-0 is headless and
    # cannot provide a graphical seat even when /sys and /run/udev are mounted.
    nodeSelector:
      node-role.kubernetes.io/control-plane: "true"
    activeDeadlineSeconds: 3600
    # Cross-workflow backpressure: this template is referenced by every
    # container-only QA pipeline, so a template-level semaphore caps total
    # concurrent runs on ghost without touching VM scheduling policy.
    synchronization:
      semaphores:
      - configMapKeyRef:
          name: workflow-semaphores
          key: ghost-container-qa
    inputs:
      parameters:
      - name: image
        value: "ghcr.io/projectbluefin/bluefin"
      - name: image-tag
        value: "testing"
      - name: image-digest
        value: ""
      - name: suite
        value: "smoke"
      - name: variant
        value: "bluefin"
      - name: branch
        value: "main"
        # testsuite-repo: canonical test repo. Override only for forks.
      - name: testsuite-repo
        value: "https://github.com/projectbluefin/testsuite"
        # testsuite-branch: branch to clone from projectbluefin/testsuite.
        # Use 'main' for nightly runs; set to a PR branch for end-to-end PR testing.
      - name: testsuite-branch
        value: "main"
      - name: behave-tags
        value: ""
    outputs:
      parameters:
      - name: result
        valueFrom:
          path: /tmp/results/result-summary.txt
          default: "No results generated"
      - name: failed-scenarios
        valueFrom:
          path: /tmp/results/failed-scenarios.json
          default: "[]"
    initContainers:
    - name: git-sync
      image: cgr.dev/chainguard/git:latest
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      volumeMounts:
      - mountPath: /workspace
        name: workspace
      command: [sh, -c]
      args:
      - |
        set -euo pipefail
        # Clone the requested testsuite revision. A missing PR branch must fail so
        # the workflow never reports a result from unrelated test code.
        TSREPO="{{inputs.parameters.testsuite-repo}}"
        TSBRANCH="{{inputs.parameters.testsuite-branch}}"
        git clone --depth 1 --branch "${TSBRANCH}" "${TSREPO}" /workspace/testsuite
        echo "Cloned testsuite @ ${TSBRANCH}"
    script:
      image: quay.io/podman/stable:latest
      imagePullPolicy: IfNotPresent
      securityContext:
        # Podman needs a writable cgroup hierarchy to boot the nested systemd host.
        privileged: true
        runAsUser: 0
        allowPrivilegeEscalation: true
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
          ephemeral-storage: 12Gi
        limits:
          cpu: "4"
          memory: 8Gi
          ephemeral-storage: 24Gi
      env:
      - name: IMAGE_REPO
        value: "{{inputs.parameters.image}}"
      - name: IMAGE_TAG
        value: "{{inputs.parameters.image-tag}}"
      - name: IMAGE_DIGEST
        value: "{{inputs.parameters.image-digest}}"
      - name: SUITE
        value: "{{inputs.parameters.suite}}"
      - name: VARIANT
        value: "{{inputs.parameters.variant}}"
      - name: BEHAVE_TAGS
        value: "{{inputs.parameters.behave-tags}}"
      - name: GITHUB_TOKEN
        valueFrom:
          secretKeyRef:
            name: github-token
            key: token
            optional: true
      volumeMounts:
      - mountPath: /workspace
        name: workspace
      - mountPath: /tmp/results
        name: results
      - mountPath: /var/lib/containers
        name: containers-storage
      - mountPath: /run/containers
        name: containers-runroot
      - mountPath: /run/udev
        name: udev
      command: [bash]
      source: |
        set -euo pipefail
        # Build slug used to identify QA evidence in the lab repo.
        IMG_SLUG="${VARIANT}-${IMAGE_TAG}"

        # Compute the image reference to pull and run. When an explicit digest is
        # supplied we use it directly and skip remote resolution so the exact
        # pinned reference is preserved end-to-end.
        IMAGE="${IMAGE_REPO}:${IMAGE_TAG}"
        if [[ -n "${IMAGE_DIGEST:-}" ]]; then
          TARGET_IMAGE="${IMAGE_REPO}@${IMAGE_DIGEST}"
          DIGEST="${IMAGE_DIGEST}"
          echo "Using provided digest ${DIGEST}; target image is ${TARGET_IMAGE}" >&2
        else
          TARGET_IMAGE="${IMAGE}"
        fi

        # Local Zot is an HTTP registry, so configure containers/image to use
        # its insecure transport before any digest resolution or image pull.
        SKOPEO_TLS_ARGS=()
        PODMAN_PULL_TLS_ARGS=()
        case "${IMAGE%%/*}" in
          192.168.1.102:*|localhost:*|127.0.0.1:*)
            SKOPEO_TLS_ARGS=(--tls-verify=false)
            PODMAN_PULL_TLS_ARGS=(--tls-verify=false)
            ;;
        esac

        # Resolve the digest remotely only when the caller did not supply one.
        zot_image() {
          case "$1" in
            ghcr.io/*) printf '192.168.1.102:30501/ghcr/%s' "${1#ghcr.io/}" ;;
            quay.io/*) printf '192.168.1.102:30501/quay/%s' "${1#quay.io/}" ;;
            docker.io/*) printf '192.168.1.102:30501/docker/%s' "${1#docker.io/}" ;;
            registry.fedoraproject.org/*) printf '192.168.1.102:30501/fedora/%s' "${1#registry.fedoraproject.org/}" ;;
            registry.k8s.io/*) printf '192.168.1.102:30501/k8s/%s' "${1#registry.k8s.io/}" ;;
            cgr.dev/*) printf '192.168.1.102:30501/cgr/%s' "${1#cgr.dev/}" ;;
            public.ecr.aws/*) printf '192.168.1.102:30501/ecr/%s' "${1#public.ecr.aws/}" ;;
            lscr.io/*) printf '192.168.1.102:30501/lscr/%s' "${1#lscr.io/}" ;;
            *) printf '%s' "$1" ;;
          esac
        }
        ZOT_IMAGE_REPO=$(zot_image "${IMAGE_REPO}")
        case "${ZOT_IMAGE_REPO}" in
          192.168.1.102:*|localhost:*|127.0.0.1:*)
            mkdir -p /etc/containers/registries.conf.d
            cat >/etc/containers/registries.conf.d/bluefin-local-zot.conf <<'EOF'
        [[registry]]
        location = "192.168.1.102:30501"
        insecure = true
        EOF
            SKOPEO_TLS_ARGS=(--tls-verify=false)
            PODMAN_PULL_TLS_ARGS=(--tls-verify=false)
            ;;
        esac
        if [[ -z "${IMAGE_DIGEST:-}" ]]; then
          if ! command -v skopeo >/dev/null 2>&1; then
            echo "skopeo not found; installing for digest resolution..." >&2
            dnf install -y skopeo >/dev/null 2>&1 || true
          fi
          DIGEST=""
          if command -v skopeo >/dev/null 2>&1 && [[ "${ZOT_IMAGE_REPO}" != "${IMAGE_REPO}" ]]; then
            DIGEST=$(timeout 120 skopeo inspect --tls-verify=false --no-tags \
              --format '{{.Digest}}' "docker://${ZOT_IMAGE_REPO}:${IMAGE_TAG}" 2>/dev/null || true)
          fi
          if [[ -z "${DIGEST:-}" ]]; then
            echo "Warning: could not resolve digest for ${IMAGE}; result will still be published but may fall back to tag-based matching." >&2
          else
            echo "Resolved digest ${DIGEST} for ${IMAGE}" >&2
          fi
        fi
        TARGET_NAME="bluefin-qa-target"
        STORAGE_CONF=/tmp/storage.conf
        cat >"${STORAGE_CONF}" <<'EOF'
        [storage]
        driver = "overlay"
        graphroot = "/var/lib/containers/storage"
        runroot = "/run/containers/storage"
        EOF
        export CONTAINERS_STORAGE_CONF="${STORAGE_CONF}"
        trap 'podman rm --force "${TARGET_NAME}" >/dev/null 2>&1 || true' EXIT

        command -v podman >/dev/null || {
          echo "Podman is required for nested systemd QA" >&2
          exit 1
        }
        mkdir -p /tmp/results
        if [[ "${ZOT_IMAGE_REPO}" != "${IMAGE_REPO}" ]]; then
          if [[ -n "${DIGEST:-}" ]]; then
            TARGET_IMAGE="${ZOT_IMAGE_REPO}@${DIGEST}"
          else
            TARGET_IMAGE="${ZOT_IMAGE_REPO}:${IMAGE_TAG}"
          fi
        fi

        # Bound every pull attempt. The shared Zot pull-through cache
        # occasionally hits "unexpected EOF" reconnecting mid-blob against
        # ghcr.io; without a client-side timeout that hang blocks this pod
        # (and its ghost-container-qa semaphore slot) for up to
        # activeDeadlineSeconds instead of minutes. Retry a bounded number of
        # times first, since a stall is often resolved by Zot's own
        # reconnect-and-resume on the next attempt.
        #
        # Podman's local blob storage persists across attempts within this
        # pod, so a retry never restarts from zero: it skips every
        # already-completed blob and only re-fetches what didn't finish.
        # Under real ghost-container-qa concurrency (up to 6 simultaneous
        # pulls sharing one node's egress), this makes attempts
        # monotonically faster -- observed live in bluefin-qa-pipeline-42jhj,
        # where attempt 3/3 reached the image's final blob and missed the
        # 480s deadline by only ~47s. 3 attempts (1500s) was sized for the
        # original instant-hang case; one extra bounded attempt (4 total,
        # 2010s worst case) covers the demonstrated near-miss for slow-but-
        # progressing pulls without unbounding any single attempt.
        PULL_ATTEMPTS=4
        PULL_TIMEOUT_SECONDS=480
        pull_ok=false
        for attempt in $(seq 1 "${PULL_ATTEMPTS}"); do
          echo "Pulling ${TARGET_IMAGE} (attempt ${attempt}/${PULL_ATTEMPTS}, ${PULL_TIMEOUT_SECONDS}s timeout)..." >&2
          if timeout "${PULL_TIMEOUT_SECONDS}" podman pull "${PODMAN_PULL_TLS_ARGS[@]}" "${TARGET_IMAGE}" >/dev/null; then
            pull_ok=true
            break
          fi
          echo "Pull attempt ${attempt} for ${TARGET_IMAGE} failed or timed out after ${PULL_TIMEOUT_SECONDS}s" >&2
          sleep 30
        done
        if [[ "${pull_ok}" != true ]]; then
          echo "Giving up on ${TARGET_IMAGE} after ${PULL_ATTEMPTS} pull attempts; registry appears stalled or unreachable" >&2
          exit 1
        fi
        podman run --detach --systemd=always --network host --privileged \
          --cgroupns=host \
          --security-opt seccomp=unconfined \
          --tmpfs /run:rw,nosuid,nodev,mode=755,size=256m \
          --name "${TARGET_NAME}" \
          --pull=never \
          --mount type=bind,source=/sys,destination=/sys,ro,bind-propagation=rprivate \
          --mount type=bind,source=/run/udev,destination=/run/udev,ro,bind-propagation=rprivate \
          --volume /workspace:/workspace:ro \
          --volume /tmp/results:/tmp/results \
          --volume /etc/resolv.conf:/etc/resolv.conf:ro \
          "${TARGET_IMAGE}" /sbin/init >/dev/null

        ready=false
        for i in $(seq 1 60); do
          state=$(podman exec "${TARGET_NAME}" systemctl is-system-running 2>/dev/null || true)
          dbus_active=$(podman exec "${TARGET_NAME}" systemctl is-active dbus 2>/dev/null || true)
          logind_active=$(podman exec "${TARGET_NAME}" systemctl is-active systemd-logind 2>/dev/null || true)
          can_graphical=$(podman exec "${TARGET_NAME}" loginctl show-seat seat0 --property=CanGraphical 2>/dev/null || true)
          echo "systemd readiness probe ${i}: state=${state:-unknown} dbus=${dbus_active:-unknown} logind=${logind_active:-unknown} seat0=${can_graphical:-unknown}"
          if [[ "${state}" == "running" || "${state}" == "degraded" ]] \
            && [[ "${dbus_active}" == "active" ]] \
            && [[ "${logind_active}" == "active" ]] \
            && [[ "${can_graphical}" == "CanGraphical=yes" ]]; then
            ready=true
            break
          fi
          sleep 2
        done
        if [[ "${ready}" != true ]]; then
          echo "Nested systemd host did not reach a usable session state" >&2
          podman exec "${TARGET_NAME}" journalctl --no-pager || true
          exit 1
        fi

        echo "Provisioning nested target (groups, test user, GDM, Python deps)..." >&2
        # NOTE: this setup script is fed over stdin via a quoted heredoc rather
        # than `bash -c '...'`. A single-quoted `bash -c` argument silently
        # terminates at the first inner apostrophe, which previously mangled the
        # `printf '%s\n'` calls below into `printf %sn` and corrupted /etc/group.
        # Do not convert this back to `bash -c`.
        setup_rc=0
        podman exec -i "${TARGET_NAME}" bash -s <<'NESTED_SETUP' || setup_rc=$?
          set -euo pipefail

          # Ensure runtime directories GDM and logind need are present before any
          # display manager startup. The container /run is a fresh tmpfs, so
          # recreate the expected layout explicitly.
          mkdir -p /run/dbus /run/systemd/seats /run/systemd/users /run/gdm /var/log/gdm
          chmod 755 /run/gdm

          # Stop GDM and clear any display state left over from the degraded boot.
          systemctl stop gdm || true
          rm -rf /run/gdm /var/log/gdm
          mkdir -p /run/gdm /var/log/gdm

          # GDM and its PreSession helpers (e.g. brew-preinstall) run as the gdm
          # user and need write access to their runtime/state directories. Ensure
          # the account and group exist and that the directories are owned by gdm.
          if ! getent group gdm >/dev/null 2>&1; then
            groupadd -r gdm
          fi
          if ! id -u gdm >/dev/null 2>&1; then
            useradd -r -g gdm -d /var/lib/gdm -s /usr/sbin/nologin gdm
          fi
          chown -R gdm:gdm /run/gdm /var/log/gdm
          chmod 755 /run/gdm
          chmod 750 /var/log/gdm

          # Make sure groups exist so the test user can access DRI/input devices.
          # Some target images expose groups through NSS without writing
          # /etc/group, while useradd only accepts local group entries.
          append_group_line() {
            # Guard against a /etc/group whose final line lacks a trailing
            # newline; appending directly would splice two entries onto one
            # line and make the following grep fail.
            if [ -s /etc/group ] && [ "$(tail -c 1 /etc/group | wc -l)" -eq 0 ]; then
              printf '\n' >>/etc/group
            fi
            printf '%s\n' "$1" >>/etc/group
          }
          for group in video render input; do
            if ! grep -q "^${group}:" /etc/group; then
              # groupadd resolves names through NSS and exits 9 ("already exists")
              # for NSS-only groups, which would abort this script under `set -e`.
              # Fall back to materializing the NSS entry as a local /etc/group line.
              if ! groupadd -r "${group}" 2>/dev/null; then
                nss_entry=$(getent group "${group}" || true)
                if [ -n "${nss_entry}" ]; then
                  append_group_line "${nss_entry}"
                else
                  # Image has no entry anywhere — synthesize with well-known fallback GIDs
                  # so tests can run on minimal images (e.g. common, knuckle CI images).
                  case "${group}" in
                    video)  gid=39  ;;
                    render) gid=989 ;;
                    input)  gid=999 ;;
                    *)      gid=997 ;;
                  esac
                  append_group_line "${group}:x:${gid}:"
                fi
              fi
            fi
            grep -q "^${group}:" /etc/group || {
              echo "Failed to create required local group ${group}" >&2
              echo "  getent group ${group}: $(getent group "${group}" || echo '<none>')" >&2
              echo "  tail of /etc/group:" >&2
              tail -n 10 /etc/group >&2
              exit 1
            }
          done

          # Create / update the test user with device groups.
          if ! id bluefin-test >/dev/null 2>&1; then
            useradd -m -u 1000 -G video,render,input bluefin-test
          else
            usermod -aG video,render,input bluefin-test
          fi

          # dogtail/qecore synthesise keyboard and pointer events by writing to
          # /dev/uinput (qecore.utility.check_uinput_availability). Podman gives
          # this privileged container its own tmpfs /dev -- a different device
          # and inode from both the pod's and the node's -- so the node it
          # materialises there is mode 0600 root:root with no group at all.
          # Group membership alone can therefore never grant access, which is
          # why bluefin-test being in `input` above is not sufficient. Because
          # the node is lane-local, giving it to the local `input` group is
          # safe and does not affect any other concurrent lane or the node.
          if [ ! -e /dev/uinput ]; then
            modprobe uinput 2>/dev/null || true
          fi
          if [ -e /dev/uinput ]; then
            chgrp input /dev/uinput && chmod 0660 /dev/uinput
            echo "uinput: $(ls -l /dev/uinput)" >&2
          else
            echo "WARNING: /dev/uinput is absent; dogtail input synthesis will fail" >&2
          fi

          # GDM PAM autologin requires a non-expired shadow lastchg value. Without
          # it the user is forced to change the password and the session never
          # registers.
          if command -v chage >/dev/null 2>&1; then
            chage -d "$(date +%Y-%m-%d)" bluefin-test
          else
            today=$(( $(date +%s) / 86400 ))
            sed -i "s/^bluefin-test:!*/bluefin-test:!:${today}:0:99999:7:::/" /etc/shadow
          fi

          # Configure sudo and auto-login before GDM starts.
          mkdir -p /etc/sudoers.d
          echo "bluefin-test ALL=(ALL) NOPASSWD: ALL" >/etc/sudoers.d/bluefin-test
          chmod 0440 /etc/sudoers.d/bluefin-test

          mkdir -p /etc/gdm
          printf "%s\n" \
            "[daemon]" \
            "AutomaticLoginEnable=True" \
            "AutomaticLogin=bluefin-test" \
            "InitialSetupEnable=False" >/etc/gdm/custom.conf

          mkdir -p /home/bluefin-test/run /tmp/results
          chown -R 1000:1000 /home/bluefin-test /tmp/results
          chmod 700 /home/bluefin-test/run

          # ROOT CAUSE FIX. Every nested target on this node shares ghost's
          # single physical GPU. mutter's native backend takes *exclusive* DRM
          # master on /dev/dri/card*, so only one nested GNOME session per node
          # can ever start. Concurrent lanes log
          #   Failed to open gpu '/dev/dri/card1': ...EBUSY: Device or resource busy
          # then stall for ~50s in "Failed to make thread 'KMS thread' high
          # priority scheduled", so every display GDM brings up dies with
          #   GdmDisplay: Session never registered, failing
          # until GDM hits its login-loop ceiling and reports
          #   GdmLocalDisplayFactory: maximum number of display failures reached. Giving up.
          # That -- not a bad autologin config -- is why GDM churns greeter
          # sessions and never recreates the uid-1000 session after the
          # qecore-headless restart. /etc/gdm/custom.conf is intact and the test
          # user stays fully resolvable throughout; the displays simply fail.
          # Force every shell instance (GDM greeter and the autologin session
          # alike) into mutter's headless backend with a virtual monitor:
          # nothing here ever renders to a physical display, and headless mutter
          # never claims DRM master, so lanes stop contending for the GPU.
          #
          # qecore-headless enables Shell.Eval by appending `--unsafe-mode` to
          # the *unit's* ExecStart (rewriting
          # /etc/systemd/user/org.gnome.Shell@.service under image mode). A
          # drop-in ExecStart= reset overrides that unit line, so `--unsafe-mode`
          # must be repeated here or every Shell.Eval call returns `(false, '')`.
          # Keep both flags together if this line is ever edited.
          mkdir -p /etc/systemd/user/org.gnome.Shell@.service.d
          printf "%s\n" \
            "[Service]" \
            "ExecStart=" \
            "ExecStart=/usr/bin/gnome-shell --mode=%i --unsafe-mode --headless --virtual-monitor 1920x1080" \
            >/etc/systemd/user/org.gnome.Shell@.service.d/10-headless.conf

          # HARDENING, not the root-cause fix. Isolated A/B on ghost showed the
          # headless drop-in above is necessary *and sufficient*, while this
          # alone is not: a linger-only lane keeps /run/user/1000/bus and the
          # uid-1000 manager session alive (Linger=yes, socket present) yet
          # still fails, because the shell never starts -- the failure class
          # simply changes from bus-unavailable=137 to service-unknown=151.
          # Keep it anyway: systemd-logind owns /run/user/1000 and destroys it,
          # together with the session bus socket inside it, the moment the
          # user's last session ends. qecore-headless stops GDM and SIGTERMs the
          # session it finds, so without lingering the XDG_RUNTIME_DIR and
          # DBUS_SESSION_BUS_ADDRESS values baked into the qecore podman exec
          # below point at a path that can disappear mid-run.
          loginctl enable-linger bluefin-test
          for _ in $(seq 1 30); do
            [ -S /run/user/1000/bus ] && break
            sleep 1
          done
          if [ ! -S /run/user/1000/bus ]; then
            echo "user@1000.service did not create /run/user/1000/bus after enable-linger" >&2
            loginctl show-user bluefin-test >&2 || true
            systemctl status user@1000.service --no-pager --full >&2 || true
            exit 1
          fi

          # Install test-only Python dependencies.
          echo "Installing test-only Python dependencies in nested target..." >&2
          if ! python3 -m pip --version >/dev/null 2>&1; then
            python3 -m ensurepip --default-pip >&2 || {
              echo "pip is unavailable and ensurepip failed in the target image" >&2
              exit 1
            }
          fi
          # Bootc/Fedora images mark the system interpreter as externally
          # managed (PEP 668); the target container is disposable, so opt out
          # when the flag is supported.
          pip_args=(--disable-pip-version-check --no-input)
          if python3 -m pip install --help 2>/dev/null | grep -q -- --break-system-packages; then
            pip_args+=(--break-system-packages)
          fi
          pip_ok=false
          for attempt in 1 2 3; do
            # setuptools is explicit and load-bearing, not incidental: qecore's
            # Sandbox._attach_version_status_to_report() does `import
            # pkg_resources` to build the per-scenario version table. That
            # module ships only with setuptools and was dropped from setuptools
            # 81+, and Python 3.12+ no longer seeds it into fresh environments,
            # so without this pin every after_scenario hook raises
            # ModuleNotFoundError. Keep it pinned below 81 for as long as qecore
            # imports pkg_resources.
            if python3 -m pip install "${pip_args[@]}" "setuptools<81" qecore dogtail behave >/tmp/pip-install.log 2>&1; then
              pip_ok=true
              break
            fi
            echo "pip install attempt ${attempt}/3 failed:" >&2
            tail -n 40 /tmp/pip-install.log >&2
            sleep 10
          done
          if [ "${pip_ok}" != true ]; then
            echo "Failed to install test-only Python dependencies (setuptools qecore dogtail behave)" >&2
            echo "  python3: $(python3 --version 2>&1)" >&2
            echo "  pip:     $(python3 -m pip --version 2>&1)" >&2
            echo "  full pip log:" >&2
            cat /tmp/pip-install.log >&2
            exit 1
          fi

          echo "Starting GDM in nested target..." >&2
          if ! systemctl start gdm; then
            gdm_rc=$?
            echo "systemctl start gdm failed (rc=${gdm_rc})" >&2
            systemctl status gdm --no-pager --full >&2 || true
            exit 1
          fi
          echo "Nested target provisioning complete." >&2
        NESTED_SETUP
        if [ "${setup_rc}" -ne 0 ]; then
          echo "Nested target provisioning failed (rc=${setup_rc}); see the errors above." >&2
          podman exec "${TARGET_NAME}" journalctl --no-pager -n 200 >&2 || true
          exit 1
        fi
        for _ in $(seq 1 60); do
          if podman exec "${TARGET_NAME}" pgrep -u 1000 -f gnome-session >/dev/null; then
            break
          fi
          sleep 2
        done
        podman exec "${TARGET_NAME}" pgrep -u 1000 -f gnome-session >/dev/null || {
          echo "GDM did not start a GNOME session for bluefin-test" >&2
          podman exec "${TARGET_NAME}" journalctl --no-pager -u gdm >&2 || true
          # gnome-shell's own journal carries the decisive line when the host
          # GPU is contended ("Failed to open gpu ...: EBUSY"); GDM alone only
          # reports the downstream "Session never registered, failing".
          podman exec "${TARGET_NAME}" journalctl --no-pager _COMM=gnome-shell >&2 || true
          podman exec "${TARGET_NAME}" loginctl list-sessions >&2 || true
          exit 1
        }

        # Bounded, non-fatal environment snapshot. Container lanes are only
        # reachable through Argo logs, so record the handful of facts that
        # explain nearly every class of environment failure: whether the shell
        # actually inherited --unsafe-mode from the headless drop-in (Shell.Eval
        # returns rc=1 without it), whether the test user can reach /dev/uinput
        # (dogtail input synthesis), and which desktop apps AT-SPI can find.
        echo "=== nested target environment snapshot ===" >&2
        podman exec "${TARGET_NAME}" bash -c 'tr "\0" " " </proc/$(pgrep -u 1000 -f "gnome-shell --mode" | head -1)/cmdline; echo' >&2 || true
        podman exec "${TARGET_NAME}" id bluefin-test >&2 || true
        podman exec "${TARGET_NAME}" ls -l /dev/uinput >&2 || true
        podman exec "${TARGET_NAME}" sh -c 'ls /usr/share/applications/org.gnome.Settings.desktop /usr/bin/gnome-control-center 2>&1' >&2 || true
        echo "=== end environment snapshot ===" >&2

        cat >/workspace/run-behave.sh <<'EOF'
        #!/bin/bash
        set -euo pipefail
        # testsuite uses its own PYTHONPATH root so 'tests.shared.*' imports resolve.
        export PYTHONPATH="/workspace/testsuite"
        SUITE="@@SUITE@@"
        BEHAVE_TAGS="@@BEHAVE_TAGS@@"

        case "${SUITE}" in
          smoke|common|developer|software|system) ;;
          *)
            echo "Unsupported container suite: ${SUITE}" >&2
            exit 2
            ;;
        esac

        echo "Waiting for GNOME Shell AT-SPI to start..." >&2
        python3 /workspace/testsuite/tests/shared/wait_for_shell.py

        echo "Starting ponytail daemon..." >&2
        /usr/libexec/gnome-ponytail-daemon &
        sleep 2

        echo "Executing behave suite..." >&2
        TAGS_ARG="--tags ~@wip"
        if [[ -n "${BEHAVE_TAGS}" ]]; then
          TAGS_ARG="${BEHAVE_TAGS}"
        fi

        BEHAVE_RC=0
        python3 -m behave /workspace/testsuite/tests/${SUITE}/features/ \
          --format json.pretty \
          --outfile /tmp/results/results.json \
          --no-capture ${TAGS_ARG} || BEHAVE_RC=$?

        echo "${BEHAVE_RC}" > /tmp/results/behave-rc.txt
        EOF
        # qecore-headless does not preserve runner env vars for the script, so bake them in.
        sed -i \
          -e "s#@@SUITE@@#${SUITE}#g" \
          -e "s#@@BEHAVE_TAGS@@#${BEHAVE_TAGS}#g" \
          /workspace/run-behave.sh
        chmod +x /workspace/run-behave.sh

        echo "Running qecore against the nested systemd/GDM host..." >&2
        QECORE_RC=0
        podman exec \
          --user 1000:1000 \
          --env SUITE \
          --env BEHAVE_TAGS \
          --env HOME=/home/bluefin-test \
          --env XDG_RUNTIME_DIR=/run/user/1000 \
          --env DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus \
          --env AT_SPI_BUS_ADDRESS=unix:path=/run/user/1000/bus \
          --env XDG_SESSION_TYPE=wayland \
          --env XDG_SESSION_DESKTOP=gnome \
          --env LIBGL_ALWAYS_SOFTWARE=1 \
          --env GALLIUM_DRIVER=llvmpipe \
          "${TARGET_NAME}" \
          qecore-headless \
          --session-type wayland \
          --session-desktop gnome \
          /workspace/run-behave.sh || QECORE_RC=$?

        BEHAVE_RC=$(cat /tmp/results/behave-rc.txt 2>/dev/null || printf '%s' "${QECORE_RC}")

        if [[ -f /tmp/results/results.json ]]; then
          python3 - <<'PY'
        import json
        import re

        with open("/tmp/results/results.json", encoding="utf-8") as result_file:
            data = json.load(result_file)
        safe_name = re.compile(r"^[A-Za-z0-9][A-Za-z0-9 .,:;()/_+-]{0,159}$")
        failed = sum(
            1 for feature in data for scenario in feature.get("elements", [])
            if scenario.get("status") == "failed"
        )
        failed_scenarios = []
        for feature in data:
            for scenario in feature.get("elements", []):
                name = scenario.get("name")
                if (
                    scenario.get("status") == "failed"
                    and isinstance(name, str)
                    and safe_name.fullmatch(name)
                    and not any(word in name.lower() for word in
                                ("token", "password", "secret", "authorization"))
                    and name not in failed_scenarios
                ):
                    failed_scenarios.append(name)
        with open("/tmp/results/failed-scenarios.json", "w", encoding="utf-8") as artifact_file:
            json.dump(failed_scenarios[:20], artifact_file, separators=(",", ":"))
        total = sum(len(feature.get("elements", [])) for feature in data)
        summary = f"{total - failed}/{total} scenarios passed"
        with open("/tmp/results/result-summary.txt", "w", encoding="utf-8") as summary_file:
            summary_file.write(summary)
        print(summary)
        PY
        else
          printf 'Execution failed' >/tmp/results/result-summary.txt
        fi


        # Publish digest-pinned test results back to the lab repo.
        if [[ -n "${GITHUB_TOKEN:-}" && -f /tmp/results/results.json ]]; then
          if ! command -v git >/dev/null 2>&1; then
            echo "git not found; installing git-core before result publication..." >&2
            dnf install -y git-core >/dev/null 2>&1 || true
          fi
          PUBLISH_RC=0
          {
            rm -rf /tmp/lab-code
            git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/projectbluefin/lab.git" /tmp/lab-code
            python3 /tmp/lab-code/scripts/publish_test_results.py /tmp/results/results.json "${IMG_SLUG}" "${SUITE}" "{{workflow.name}}" "${GITHUB_TOKEN}" "${DIGEST}"
          } || PUBLISH_RC=$?
          if [[ "${PUBLISH_RC}" -ne 0 ]]; then
            echo "Warning: failed to publish test results (rc=${PUBLISH_RC})" >&2
          fi
        elif [[ -z "${GITHUB_TOKEN:-}" ]]; then
          echo "No GITHUB_TOKEN - skipping test results publication" >&2
        else
          echo "Skipping publication: /tmp/results/results.json not found" >&2
        fi

        exit "${BEHAVE_RC}"
    volumes:
    - name: workspace
      emptyDir: {}
    - name: results
      emptyDir: {}
    - name: containers-storage
      emptyDir: {}
    - name: containers-runroot
      emptyDir: {}
    - name: udev
      hostPath:
        path: /run/udev
        type: Directory
