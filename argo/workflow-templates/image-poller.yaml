apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: image-poller
  namespace: argo
  labels:
    app.kubernetes.io/component: image-poller
    app.kubernetes.io/part-of: bluefin-test-suite
spec:
  serviceAccountName: argo
  # The poller is the Workflow that owns digest-triggered container QA; the
  # child templateRef is a DAG node, not a distinct Workflow.
  workflowMetadata:
    labels:
      bluefin.io/evidence-contract: qa-run-v1
  activeDeadlineSeconds: 14400
  # Serialize polls for the same state key across CronWorkflow instances.
  # This makes the compare/QA/update sequence single-flight: a queued poll
  # rechecks the ConfigMap after the first poll persists the digest.
  synchronization:
    mutexes:
      - name: "image-poll-{{workflow.parameters.state-key}}"
  entrypoint: check-and-trigger
  arguments:
    parameters:
      - name: image
      - name: image-tag
      # This caller resolves a digest at runtime for the referenced QA
      # template; declare the parameter so Argo can validate that reference.
      - name: image-digest
        value: ""
      - name: state-key
      - name: namespace
        value: "bluefin-test"
      - name: run-qa
        value: "true"
      - name: suites
        value: "smoke,common,developer,software,system"
      - name: variant
        value: "bluefin"
      - name: branch
        value: "main"
      - name: testsuite-branch
        value: "main"
      # QA pipeline templates resolve {{workflow.parameters.testsuite-repo}} at
      # validation time; CronWorkflows referencing this template do not set it,
      # so a default here is required for their syncs to validate.
      - name: testsuite-repo
        value: "https://github.com/projectbluefin/testsuite"

  templates:
    - name: check-and-trigger
      dag:
        tasks:
          - name: check-digest
            template: poll-digest
            arguments:
              parameters:
                - name: image
                  value: "{{workflow.parameters.image}}"
                - name: image-tag
                  value: "{{workflow.parameters.image-tag}}"
                - name: state-key
                  value: "{{workflow.parameters.state-key}}"
          - name: run-pipeline
            depends: "check-digest.Succeeded"
            when: "{{tasks.check-digest.outputs.parameters.changed}} == true && {{workflow.parameters.run-qa}} == true"
            templateRef:
              name: bluefin-qa-pipeline
              template: pipeline
            arguments:
              parameters:
                - name: image
                  value: "{{workflow.parameters.image}}"
                - name: image-tag
                  value: "{{workflow.parameters.image-tag}}"
                - name: image-digest
                  value: "{{tasks.check-digest.outputs.parameters.remote-digest}}"
                - name: suites
                  value: "{{workflow.parameters.suites}}"
                - name: variant
                  value: "{{workflow.parameters.variant}}"
                - name: branch
                  value: "{{workflow.parameters.branch}}"
                - name: testsuite-branch
                  value: "{{workflow.parameters.testsuite-branch}}"
                - name: testsuite-repo
                  value: "{{workflow.parameters.testsuite-repo}}"
          - name: update-digest
            depends: "check-digest.Succeeded && (run-pipeline.Succeeded || run-pipeline.Skipped)"
            when: "{{tasks.check-digest.outputs.parameters.changed}} == true"
            template: update-local
            arguments:
              parameters:
                - name: state-key
                  value: "{{workflow.parameters.state-key}}"
                - name: remote-digest
                  value: "{{tasks.check-digest.outputs.parameters.remote-digest}}"
                - name: expected-digest
                  value: "{{tasks.check-digest.outputs.parameters.stored-digest}}"

    - name: poll-digest
      inputs:
        parameters:
          - name: image
          - name: image-tag
          - name: state-key
      outputs:
        parameters:
          - name: changed
            valueFrom:
              parameter: "{{tasks.compare.outputs.parameters.changed}}"
          - name: remote-digest
            valueFrom:
              parameter: "{{tasks.fetch.outputs.parameters.digest}}"
          - name: stored-digest
            valueFrom:
              parameter: "{{tasks.compare.outputs.parameters.stored-digest}}"
      dag:
        tasks:
          - name: fetch
            template: fetch-remote
            arguments:
              parameters:
                - name: image
                  value: "{{inputs.parameters.image}}"
                - name: image-tag
                  value: "{{inputs.parameters.image-tag}}"
          - name: compare
            depends: "fetch.Succeeded"
            template: compare-local
            arguments:
              parameters:
                - name: state-key
                  value: "{{inputs.parameters.state-key}}"
                - name: remote-digest
                  value: "{{tasks.fetch.outputs.parameters.digest}}"

    - name: fetch-remote
      inputs:
        parameters:
          - name: image
          - name: image-tag
      outputs:
        parameters:
          - name: digest
            valueFrom:
              path: /tmp/digest
      metadata:
        labels:
          app.kubernetes.io/part-of: bluefin-test-suite
          bluefin.io/step: fetch-digest
      script:
        image: quay.io/skopeo/stable@sha256:c7d3c512612f52805023cd38351081dad7e2729fc13d14b701e47c7c8bdd6615
        command: [sh]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        env:
          - name: GITHUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-token
                key: token
        source: |
          set -eu
          IMAGE_REF="{{inputs.parameters.image}}:{{inputs.parameters.image-tag}}"
          # Inspect upstream directly, NOT through the zot cache: zot on-demand
          # sync copies the manifest AND all blobs on a tag reference, so polling
          # through zot pulled every new multi-GB image even when QA was skipped.
          # A direct inspect fetches the manifest only (kilobytes).
          CREDS_ARGS=()
          case "${IMAGE_REF}" in
            ghcr.io/*) CREDS_ARGS=(--creds "_token:${GITHUB_TOKEN}") ;;
          esac
          REMOTE=""
          for i in 1 2 3; do
            REMOTE=$(timeout 60s skopeo inspect --no-tags \
              --format '{{.Digest}}' "${CREDS_ARGS[@]}" \
              "docker://${IMAGE_REF}" 2>/dev/null || true)
            [ -n "${REMOTE}" ] && break
            echo "skopeo attempt ${i}/3 failed for ${IMAGE_REF}; retrying in $(( i * 15 ))s" >&2
            sleep $(( i * 15 ))
          done

          if [ -z "${REMOTE}" ]; then
            echo "Failed to resolve digest" >&2
            echo "none" > /tmp/digest
          else
            echo "${REMOTE}" > /tmp/digest
          fi

    - name: compare-local
      inputs:
        parameters:
          - name: state-key
          - name: remote-digest
      outputs:
        parameters:
          - name: changed
            valueFrom:
              path: /tmp/changed
          - name: stored-digest
            valueFrom:
              path: /tmp/stored-digest
      metadata:
        labels:
          app.kubernetes.io/part-of: bluefin-test-suite
          bluefin.io/step: compare-digest
      script:
        image: cgr.dev/chainguard/kubectl:latest-dev
        command: [bash]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        source: |
          set -euo pipefail
          KEY="{{inputs.parameters.state-key}}"
          REMOTE="{{inputs.parameters.remote-digest}}"
          STORED=$(kubectl get configmap image-polling-digests -n argo \
            -o jsonpath="{.data.${KEY}}" 2>/dev/null || true)

          printf '%s' "${STORED}" > /tmp/stored-digest

          if [[ "${REMOTE}" == "none" ]]; then
            echo "No remote digest fetched. Skipping." >&2
            echo "false" > /tmp/changed
            exit 0
          fi

          echo "Remote: ${REMOTE}" >&2
          echo "Stored: ${STORED:-<none>}" >&2

          if [[ "${REMOTE}" == "${STORED}" ]]; then
            echo "No change." >&2
            echo "false" > /tmp/changed
          else
            echo "Digest changed." >&2
            echo "true" > /tmp/changed
          fi

    - name: update-local
      inputs:
        parameters:
          - name: state-key
          - name: remote-digest
          - name: expected-digest
      metadata:
        labels:
          app.kubernetes.io/part-of: bluefin-test-suite
          bluefin.io/step: update-digest
      script:
        image: cgr.dev/chainguard/kubectl:latest-dev
        command: [bash]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        source: |
          set -euo pipefail
          KEY="{{inputs.parameters.state-key}}"
          REMOTE="{{inputs.parameters.remote-digest}}"
          EXPECTED="{{inputs.parameters.expected-digest}}"
          STORED=$(kubectl get configmap image-polling-digests -n argo \
            -o jsonpath="{.data.${KEY}}" 2>/dev/null || true)

          if [[ "${STORED}" != "${EXPECTED}" ]]; then
            echo "State changed since check (expected '${EXPECTED}', found '${STORED}'); skipping stale write." >&2
            exit 0
          fi

          echo "Persisting new digest for ${KEY}: ${REMOTE}" >&2
          kubectl patch configmap image-polling-digests \
            -n argo --type merge \
            -p "{\"data\":{\"${KEY}\":\"${REMOTE}\"}}" 2>/dev/null \
            || kubectl create configmap image-polling-digests \
                 -n argo --from-literal="${KEY}=${REMOTE}"
