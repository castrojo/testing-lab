apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: register-wec
  namespace: argo
spec:
  entrypoint: register
  serviceAccountName: kubestellar-bootstrap
  arguments:
    parameters:
    - name: wec-name
      value: ghost
  templates:
  - name: register
    inputs:
      parameters:
      - name: wec-name
        value: "{{workflow.parameters.wec-name}}"
    script:
      command:
      - bash
      image: ghcr.io/projectbluefin/lab-runner:latest
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      source: |
        set -euo pipefail
        WEC="{{inputs.parameters.wec-name}}"
        echo "-> Installing clusteradm (pinned, extracted via python tarfile)..."
        CLUSTERADM_VERSION=0.10.1
        curl -sSL -o /tmp/clusteradm.tar.gz \
          "https://github.com/open-cluster-management-io/clusteradm/releases/download/v${CLUSTERADM_VERSION}/clusteradm_linux_amd64.tar.gz"
        python3 -c "import tarfile; tarfile.open('/tmp/clusteradm.tar.gz').extractall('/tmp/clusteradm-bin')"
        chmod +x /tmp/clusteradm-bin/clusteradm
        export PATH="/tmp/clusteradm-bin:$PATH"
        clusteradm version || true

        echo "-> Fetching its1 (hub) kubeconfig from KubeFlex secret..."
        # its1 is type host: the hub runs on this cluster's API server, but
        # OCM components live in the its1 KubeFlex namespace. In-cluster SA
        # credentials address the same API server.
        HUB_APISERVER="https://kubernetes.default.svc"

        echo "-> Getting bootstrap token from hub..."
        TOKEN_CMD=$(clusteradm get token --use-bootstrap-token 2>/dev/null || clusteradm get token)
        TOKEN=$(echo "$TOKEN_CMD" | grep -oP '(?<=--hub-token )\S+' | head -1)

        echo "-> Joining $WEC to its1 (self-registration, in-cluster endpoint)..."
        clusteradm join \
          --hub-token "$TOKEN" \
          --hub-apiserver "$HUB_APISERVER" \
          --cluster-name "$WEC" \
          --singleton \
          --force-internal-endpoint-lookup \
          --wait || true

        echo "-> Accepting CSR for $WEC..."
        for i in $(seq 1 30); do
          if clusteradm accept --clusters "$WEC" 2>/dev/null; then break; fi
          sleep 10
        done

        echo "-> Verifying ManagedCluster..."
        kubectl label managedcluster "$WEC" name="$WEC" --overwrite
        kubectl get managedclusters "$WEC" -o wide
        kubectl wait managedcluster/"$WEC" \
          --for=condition=ManagedClusterConditionAvailable --timeout=300s
        echo "OK $WEC registered as WEC"
