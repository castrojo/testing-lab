apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: dakota-publish-pipeline
  namespace: argo
  annotations:
    description: |
      Publishes the local Zot dakota:testing and dakota-nvidia:testing images
      to GHCR by source digest, verifies each destination digest, and copies
      OCI referrers when present. Requires the ghcr-publish-auth Secret.
    bluefin.io/ghcr-publish-auth-secret-type: kubernetes.io/dockerconfigjson
  labels:
    app.kubernetes.io/component: image-publisher
    app.kubernetes.io/part-of: dakota-test-suite
spec:
  serviceAccountName: argo
  activeDeadlineSeconds: 14400
  entrypoint: publish-all
  onExit: publish-run-history
  podGC:
    strategy: OnWorkflowCompletion
  ttlStrategy:
    secondsAfterSuccess: 86400
    secondsAfterFailure: 604800

  templates:
    - name: publish-all
      synchronization:
        semaphores:
          - configMapKeyRef:
              name: workflow-semaphores
              key: dakota-publish
      dag:
        tasks:
          - name: publish-dakota
            template: publish-lane
            arguments:
              parameters:
                - name: image
                  value: dakota

          - name: publish-dakota-nvidia
            template: publish-lane
            arguments:
              parameters:
                - name: image
                  value: dakota-nvidia

          - name: verify-lane-results
            depends: >-
              (publish-dakota.Succeeded || publish-dakota.Failed || publish-dakota.Errored) &&
              (publish-dakota-nvidia.Succeeded || publish-dakota-nvidia.Failed || publish-dakota-nvidia.Errored)
            template: verify-lane-results
            arguments:
              parameters:
                - name: dakota-status
                  value: "{{tasks.publish-dakota.status}}"
                - name: dakota-nvidia-status
                  value: "{{tasks.publish-dakota-nvidia.status}}"

    - name: publish-lane
      activeDeadlineSeconds: 3600
      retryStrategy:
        limit: "2"
        retryPolicy: Always
        backoff:
          duration: "30s"
          factor: "2"
          maxDuration: "2m"
      inputs:
        parameters:
          - name: image
      volumes:
        - name: ghcr-auth
          secret:
            secretName: ghcr-publish-auth
            optional: true
            items:
              - key: .dockerconfigjson
                path: config.json
      script:
        image: quay.io/skopeo/stable@sha256:c7d3c512612f52805023cd38351081dad7e2729fc13d14b701e47c7c8bdd6615
        command: [bash]
        volumeMounts:
          - name: ghcr-auth
            mountPath: /auth
            readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
            ephemeral-storage: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi
            ephemeral-storage: 4Gi
        env:
          - name: IMAGE
            value: "{{inputs.parameters.image}}"
          - name: SOURCE_REGISTRY
            value: "192.168.1.102:30500"
          - name: IMAGE_TAG
            value: testing
        source: |
          set -euo pipefail

          echo "ERROR: GHCR push destination is forbidden; publish to local Zot instead." >&2
          exit 1

    - name: publish-run-history
      volumes:
        - name: ghcr-auth
          secret:
            secretName: ghcr-publish-auth
            optional: true
            items:
              - key: .dockerconfigjson
                path: config.json
        - name: history-work
          emptyDir: {}
      script:
        image: ghcr.io/projectbluefin/lab-runner:latest
        command: [bash]
        volumeMounts:
          - name: ghcr-auth
            mountPath: /auth
            readOnly: true
          - name: history-work
            mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 1Gi
        env:
          - name: GITHUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-token
                key: token
          - name: WORKFLOW_NAME
            value: "{{workflow.name}}"
          - name: WORKFLOW_STATUS
            value: "{{workflow.status}}"
          - name: STARTED_AT
            value: "{{workflow.creationTimestamp.RFC3339}}"
        source: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "ERROR: Dakota publish history persistence failed (exit ${rc})" >&2; exit "${rc}"' ERR

          FINISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          RUN_URL="http://192.168.1.102:2746/workflows/argo/${WORKFLOW_NAME}"
          RECORD=/workspace/run.json

          if [ "${WORKFLOW_STATUS}" = Succeeded ]; then
            jq -n \
              --arg workflow_name "${WORKFLOW_NAME}" \
              --arg started_at "${STARTED_AT}" \
              --arg finished_at "${FINISHED_AT}" \
              --arg run_url "${RUN_URL}" \
              '{
                kind: "publish",
                workflow_name: $workflow_name,
                status: "passed",
                started_at: $started_at,
                finished_at: $finished_at,
                run_url: $run_url
              }' > "${RECORD}"
          else
            jq -n \
              --arg workflow_name "${WORKFLOW_NAME}" \
              --arg started_at "${STARTED_AT}" \
              --arg finished_at "${FINISHED_AT}" \
              --arg run_url "${RUN_URL}" \
              '{
                kind: "publish",
                workflow_name: $workflow_name,
                status: "failed",
                started_at: $started_at,
                finished_at: $finished_at,
                run_url: $run_url,
                failure_class: "publish",
                failure_stage: "publish-pipeline"
              }' > "${RECORD}"
          fi

          curl -sSfL \
            https://raw.githubusercontent.com/projectbluefin/lab/main/scripts/publish_dakota_run.py \
            -o /workspace/publish_dakota_run.py
          python3 /workspace/publish_dakota_run.py publish "${RECORD}" --work-dir /workspace

          trap - ERR
          echo "Dakota publish history persisted for ${WORKFLOW_NAME}" >&2

    - name: verify-lane-results
      inputs:
        parameters:
          - name: dakota-status
          - name: dakota-nvidia-status
      script:
        image: ghcr.io/projectbluefin/lab-runner:latest
        command: [bash]
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
            ephemeral-storage: 16Mi
          limits:
            cpu: 100m
            memory: 128Mi
            ephemeral-storage: 64Mi
        env:
          - name: DAKOTA_STATUS
            value: "{{inputs.parameters.dakota-status}}"
          - name: DAKOTA_NVIDIA_STATUS
            value: "{{inputs.parameters.dakota-nvidia-status}}"
        source: |
          set -euo pipefail

          echo "dakota:testing publication: ${DAKOTA_STATUS}"
          echo "dakota-nvidia:testing publication: ${DAKOTA_NVIDIA_STATUS}"

          if [ "${DAKOTA_STATUS}" != Succeeded ] || [ "${DAKOTA_NVIDIA_STATUS}" != Succeeded ]; then
            echo "ERROR: one or more Dakota publication lanes failed" >&2
            exit 1
          fi
