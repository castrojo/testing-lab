apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: run-kde-tests
  namespace: argo
  annotations:
    description: |
      Runs a testsuite KDE suite against an Aurora/KDE KubeVirt VM by adapting
      the GNOME runner's clone, SSH, result persistence, and publication
      contract to selenium-webdriver-at-spi.
spec:
  serviceAccountName: argo
  templates:
  - name: run-kde-tests
    inputs:
      parameters:
      - name: vm-name
      - name: vm-namespace
        value: "aurora-test"
      - name: suite
        value: "kde-smoke"
      - name: variant
        value: "aurora"
      - name: ssh-user
        value: "bluefin-test"
      - name: ssh-key-secret
        value: "bluefin-test-ssh-key"
      - name: issue-title
        value: "manual"
      - name: behave-tags
        value: ""
      - name: branch
        value: "main"
      - name: containerdisk-tag
        value: ""
      - name: sabotage-mode
        value: "none"
      - name: failure-class
        value: "test"
      - name: failure-issue-url
        value: ""
      - name: behave-retries
        value: "2"
    outputs:
      parameters:
      - name: result
        valueFrom:
          path: /tmp/results/result-summary.txt
      - name: failed-scenarios
        valueFrom:
          path: /tmp/results/failed-scenarios.json
          default: "[]"
    activeDeadlineSeconds: 3600
    initContainers:
    - name: git-sync
      image: ghcr.io/projectbluefin/lab-runner@sha256:fe097bb3b85a126b9a16093fbc498b4b6fb7b24e0f74162ad3d91a402dcfa940
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      env:
      - name: BRANCH
        value: "{{inputs.parameters.branch}}"
      - name: SABOTAGE_MODE
        value: "{{inputs.parameters.sabotage-mode}}"
      - name: BEHAVE_RETRIES
        value: "{{inputs.parameters.behave-retries}}"
      - name: FAILURE_CLASS
        value: "{{inputs.parameters.failure-class}}"
      - name: FAILURE_ISSUE_URL
        value: "{{inputs.parameters.failure-issue-url}}"
      command: [bash, -c]
      args:
      - |
        set -euo pipefail
        case "${FAILURE_CLASS}" in
          test) ;;
          infra)
            [[ -n "${FAILURE_ISSUE_URL}" ]] ||
              { echo "Infra failures require a filed issue URL" >&2; exit 2; }
            ;;
          *)
            echo "Unsupported failure class: ${FAILURE_CLASS}" >&2
            exit 2
            ;;
        esac
        [[ "${BEHAVE_RETRIES}" == "2" ]] ||
          { echo "KDE soak runs require BEHAVE_RETRIES=2" >&2; exit 2; }
        git clone --depth 1 --branch "${BRANCH}" \
          https://github.com/projectbluefin/testsuite /workspace/testsuite
        case "${SABOTAGE_MODE}" in
          none) ;;
          missing-binary)
            sed -i '0,/Launch "kcmshell6 kcm_autostart"/s//Launch "\/usr\/bin\/this-does-not-exist kcm_autostart"/' \
              /workspace/testsuite/tests/kde-smoke/features/kde_smoke.feature
            grep -q '/usr/bin/this-does-not-exist' \
              /workspace/testsuite/tests/kde-smoke/features/kde_smoke.feature
            ;;
          kill-plasmashell) ;;
          *)
            echo "Unsupported sabotage mode: ${SABOTAGE_MODE}" >&2
            exit 2
            ;;
        esac
      volumeMounts:
      - name: workspace
        mountPath: /workspace
    container:
      image: ghcr.io/projectbluefin/lab-runner@sha256:fe097bb3b85a126b9a16093fbc498b4b6fb7b24e0f74162ad3d91a402dcfa940
      resources:
        requests:
          cpu: "1"
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 2Gi
      env:
      - name: VM_NAME
        value: "{{inputs.parameters.vm-name}}"
      - name: VM_NS
        value: "{{inputs.parameters.vm-namespace}}"
      - name: SSH_KEY
        value: /etc/ssh/test-key/id_ed25519
      - name: VM_USER
        value: "{{inputs.parameters.ssh-user}}"
      - name: SUITE
        value: "{{inputs.parameters.suite}}"
      - name: VARIANT
        value: "{{inputs.parameters.variant}}"
      - name: CONTAINERDISK_TAG
        value: "{{inputs.parameters.containerdisk-tag}}"
      - name: BEHAVE_TAGS
        value: "{{inputs.parameters.behave-tags}}"
      - name: IMAGE
        value: kde-linux
      - name: VM_HOST
        value: 127.0.0.1
      - name: SSH_PORT
        value: "2222"
      - name: KDE_WEBDRIVER_URL
        value: http://127.0.0.1:4723
      - name: SABOTAGE_MODE
        value: "{{inputs.parameters.sabotage-mode}}"
      - name: FAILURE_CLASS
        value: "{{inputs.parameters.failure-class}}"
      - name: FAILURE_ISSUE_URL
        value: "{{inputs.parameters.failure-issue-url}}"
      - name: GITHUB_TOKEN
        valueFrom:
          secretKeyRef:
            name: github-token
            key: token
      volumeMounts:
      - name: workspace
        mountPath: /workspace
        readOnly: true
      - name: results
        mountPath: /results
      - name: results-store
        mountPath: /var/mnt/ghost-data/test-results
      - name: ssh-key
        mountPath: /etc/ssh/test-key
        readOnly: true
      command: [bash, -c]
      args:
      - |
        set -euo pipefail
        for tool in bash curl find git python3 scp ssh timeout; do
          command -v "${tool}" >/dev/null ||
            { echo "Required tool is missing: ${tool}" >&2; exit 2; }
        done
        [[ -n "${GITHUB_TOKEN:-}" ]] ||
          { echo "Required credential is missing: GITHUB_TOKEN" >&2; exit 2; }
        mkdir -p /tmp/results
        VIRTCTL=/usr/local/bin/virtctl
        if [[ ! -x "${VIRTCTL}" ]]; then
          curl --fail --location --retry 3 --output "${VIRTCTL}" \
            https://github.com/kubevirt/kubevirt/releases/download/v1.8.2/virtctl-v1.8.2-linux-amd64
          chmod +x "${VIRTCTL}"
        fi
        "${VIRTCTL}" port-forward -n "${VM_NS}" "vmi/${VM_NAME}" 2222:22 4723:4723 &
        PF_PID=$!
        trap 'kill "${PF_PID}" 2>/dev/null || true' EXIT
        timeout 600 bash -c '
          until ssh -i "${SSH_KEY}" -p 2222 -o StrictHostKeyChecking=no
              -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10
              "${VM_USER}@127.0.0.1" true 2>/dev/null; do sleep 5; done'
        ssh -i "${SSH_KEY}" -p 2222 -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null "${VM_USER}@127.0.0.1" \
          '
          set -e
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          SESSION_BUS=$(systemctl --user show-environment 2>/dev/null |
            sed -n "s/^DBUS_SESSION_BUS_ADDRESS=//p" | head -1)
          if [ -z "${SESSION_BUS}" ] && [ -S "${XDG_RUNTIME_DIR}/bus" ]; then
            SESSION_BUS="unix:path=${XDG_RUNTIME_DIR}/bus"
          fi
          WAYLAND_DISPLAY=$(find "${XDG_RUNTIME_DIR}" -maxdepth 1 \
            -name "wayland-*" -printf "%f\n" 2>/dev/null | head -1)
          AT_SPI_BUS_ADDRESS="${SESSION_BUS}"
          KDE_WEBDRIVER_URL=http://127.0.0.1:4723
          printf "%s\n" \
            "export DBUS_SESSION_BUS_ADDRESS=${SESSION_BUS}" \
            "export WAYLAND_DISPLAY=${WAYLAND_DISPLAY}" \
            "export XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}" \
            "export AT_SPI_BUS_ADDRESS=${AT_SPI_BUS_ADDRESS}" \
            "export XDG_SESSION_TYPE=wayland" \
            "export XDG_SESSION_DESKTOP=kde" \
            "export KDE_WEBDRIVER_URL=${KDE_WEBDRIVER_URL}" \
            "export TESTSUITE_RESULTS_DIR=/tmp/results" \
            > /tmp/session.env
          mkdir -p /tmp/results
          source /tmp/session.env
          command -v selenium-webdriver-at-spi-run
          nohup selenium-webdriver-at-spi-run \
            >/tmp/selenium-webdriver-at-spi.log 2>&1 </dev/null &
          '
        timeout 120 bash -c 'until curl --fail --silent "${KDE_WEBDRIVER_URL}/status" >/dev/null; do sleep 2; done'
        cd /workspace/testsuite
        python3 -m pip install --quiet selenium behave
        export PYTHONPATH=/workspace/testsuite
        export TESTSUITE_RESULTS_DIR=/tmp/results
        export BEHAVE_RETRIES=2
        case "${SABOTAGE_MODE}" in
          none) ;;
          missing-binary)
            [[ "${VM_NS}" == "aurora-test" ]] ||
              { echo "Refusing sabotage outside aurora-test" >&2; exit 2; }
            ;;
          kill-plasmashell)
            [[ "${VM_NS}" == "aurora-test" ]] ||
              { echo "Refusing sabotage outside aurora-test" >&2; exit 2; }
            ssh -i "${SSH_KEY}" -p 2222 -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null "${VM_USER}@127.0.0.1" \
              'pgrep -x plasmashell'
            ssh -i "${SSH_KEY}" -p 2222 -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null "${VM_USER}@127.0.0.1" \
              'pkill -x plasmashell'
            ;;
          *)
            echo "Unsupported sabotage mode: ${SABOTAGE_MODE}" >&2
            exit 2
            ;;
        esac
        TAGS_ARG="--tags ~@wip"
        if [[ -n "${BEHAVE_TAGS}" ]]; then
          TAGS_ARG="${BEHAVE_TAGS}"
        fi
        BEHAVE_RC=0
        python3 -m behave "tests/${SUITE}/features" \
          --format json.pretty --outfile /results/results.json --no-capture \
          ${TAGS_ARG} || BEHAVE_RC=$?

        # KDE's failure hook writes screenshots and diagnostic directories inside
        # the guest session. Copy them back even when Behave reports failures.
        ARTIFACT_RC=0
        if ! scp -i "${SSH_KEY}" -P 2222 -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null -r \
          "${VM_USER}@127.0.0.1:/tmp/results/." /tmp/results/; then
          echo "ERROR: failed to collect in-guest KDE artifacts" >&2
          ARTIFACT_RC=1
        fi

        # Derive the bounded failed-scenario list consumed by the
        # `failed-scenarios` output parameter and the QA run evidence
        # reconciler (same contract as the GNOME runner).
        if [[ -f /results/results.json ]]; then
          python3 - /results/results.json > /tmp/results/failed-scenarios.json <<'PY'
        import json
        import re
        import sys

        with open(sys.argv[1], encoding="utf-8") as result_file:
            data = json.load(result_file)
        safe_name = re.compile(r"^[A-Za-z0-9][A-Za-z0-9 .,:;()/_+-]{0,159}$")
        failed_scenarios = []
        for feature in data:
            for scenario in feature.get("elements", []):
                name = scenario.get("name")
                if (
                    scenario.get("status") == "failed"
                    and isinstance(name, str)
                    and safe_name.fullmatch(name)
                    and not any(word in name.lower() for word in
                                ("token", "password", "secret", "authorization"))
                    and name not in failed_scenarios
                ):
                    failed_scenarios.append(name)
        json.dump(failed_scenarios[:20], sys.stdout, separators=(",", ":"))
        PY
        fi

        # Keep both the directory and a portable tarball for each kde_faillog
        # bundle produced by the testsuite failure hook. lab-runner does not
        # provide tar, so use the guaranteed Python standard library tool.
        while IFS= read -r -d '' bundle; do
          if ! (
            cd "$(dirname "${bundle}")" &&
            python3 -m tarfile -c "${bundle}.tar.gz" "$(basename "${bundle}")"
          ); then
            echo "ERROR: failed to archive KDE failure bundle ${bundle}" >&2
            ARTIFACT_RC=1
          fi
        done < <(find /tmp/results -type d -name 'faillog_*' -print0)

        # Sabotage runs persist into their own evidence directory so the two
        # sabotage modes cannot clobber each other's results.json and faillog
        # bundles; non-sabotage runs keep the historical path.
        if [[ "${SABOTAGE_MODE}" == "none" ]]; then
          RESULT_DIR="/var/mnt/ghost-data/test-results/{{workflow.name}}/${SUITE}"
        else
          RESULT_DIR="/var/mnt/ghost-data/test-results/{{workflow.name}}/${SUITE}-sabotage-${SABOTAGE_MODE}"
        fi
        mkdir -p "${RESULT_DIR}"
        if ! cp -r /tmp/results/. "${RESULT_DIR}/"; then
          echo "ERROR: failed to persist KDE results to ${RESULT_DIR}" >&2
          ARTIFACT_RC=1
        fi
        if [[ -f /results/results.json ]]; then
          if ! cp /results/results.json "${RESULT_DIR}/"; then
            echo "ERROR: failed to persist results.json to ${RESULT_DIR}" >&2
            ARTIFACT_RC=1
          fi
        else
          echo "ERROR: Behave did not produce /results/results.json" >&2
          ARTIFACT_RC=1
        fi
        echo "Results and KDE artifacts saved to ${RESULT_DIR}" >&2

        # KubeVirt's virt-launcher exposes no QEMU monitor, and GHCR
        # publication is disabled repo-wide. Retain screenshots in the
        # hostPath results bundle only.
        SHOT=$(find /tmp/results -type f -name '*.png' -print -quit)
        if [[ -z "${SHOT}" || ! -f "${SHOT}" ]]; then
          echo "ERROR: KDE test did not produce a screenshot artifact" >&2
          ARTIFACT_RC=1
        else
          echo "GHCR screenshot publication disabled; retaining screenshot locally only." >&2
        fi

        # publish_test_results.py keys results by "<img-slug>-<suite>.json".
        # Derive the slug the same way the GNOME runner does: variant plus
        # containerdisk tag (aurora + testing -> aurora-testing). Sabotage runs
        # publish under a sabotage-specific suite label so their intentional
        # red results do not pollute the KDE soak-gate history and each mode's
        # published evidence survives the second run.
        IMG_SLUG="${VARIANT}"
        if [[ -n "${CONTAINERDISK_TAG}" ]]; then
          IMG_SLUG="${VARIANT}-${CONTAINERDISK_TAG}"
        fi
        PUBLISH_SUITE="${SUITE}"
        if [[ "${SABOTAGE_MODE}" != "none" ]]; then
          PUBLISH_SUITE="${SUITE}-sabotage-${SABOTAGE_MODE}"
        fi

        PUBLISH_RC=0
        if ! {
          rm -rf /workspace/lab-code
          git clone --depth 1 \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/projectbluefin/lab.git" \
            /workspace/lab-code
          python3 /workspace/lab-code/scripts/publish_test_results.py \
            /results/results.json "${IMG_SLUG}" "${PUBLISH_SUITE}" \
            "{{workflow.name}}" "${GITHUB_TOKEN}" "" \
            "${FAILURE_CLASS}" "${FAILURE_ISSUE_URL}"
        }; then
          echo "ERROR: failed to publish KDE test results" >&2
          PUBLISH_RC=1
        fi

        # Publish a result only when structured Behave output exists and can
        # be parsed. A missing summary must not make an execution failure look
        # successful to the evidence reconciler.
        if [[ -f /results/results.json ]]; then
          python3 -c "
        import json, sys
        data = json.load(open('/results/results.json'))
        failed = sum(1 for f in data for s in f.get('elements',[]) if s.get('type') == 'scenario' and s.get('status') == 'failed')
        total = sum(1 for f in data for s in f.get('elements',[]) if s.get('type') == 'scenario')
        print(f'{total - failed}/{total} scenarios passed')
          " > /tmp/results/result-summary.txt 2>/dev/null || {
            rm -f /tmp/results/result-summary.txt
            echo "ERROR: unable to derive result summary from results.json" >&2
          }
        fi
        # Print full results JSON to stderr — captured by Loki and Argo logs.
        if [[ -f /results/results.json ]]; then
          echo "=== BEHAVE RESULTS JSON ===" >&2
          cat /results/results.json >&2
          echo "=== END BEHAVE RESULTS ===" >&2
        fi

        # Gate B: a sabotaged run must go red with a recorded error, never a
        # silent pass or an all-skip. Verify the behave results actually
        # recorded failed scenarios before trusting the exit code.
        SABOTAGE_VERDICT_RC=0
        if [[ "${SABOTAGE_MODE}" != "none" ]]; then
          python3 - "${SABOTAGE_MODE}" /results/results.json <<'SABOTAGE_VERDICT' || SABOTAGE_VERDICT_RC=1
        import json
        import sys

        mode, results_path = sys.argv[1], sys.argv[2]
        try:
            with open(results_path, encoding="utf-8") as handle:
                data = json.load(handle)
        except (OSError, ValueError) as exc:
            print(
                "SABOTAGE VERDICT ERROR: behave results for '%s' are unreadable: %s"
                % (mode, exc),
                file=sys.stderr,
            )
            sys.exit(1)
        scenarios = [
            element
            for feature in data
            for element in feature.get("elements", [])
            if element.get("type") == "scenario"
        ]
        failed = [s for s in scenarios if s.get("status") == "failed"]
        skipped = [s for s in scenarios if s.get("status") == "skipped"]
        if not scenarios:
            print(
                "SABOTAGE VERDICT ERROR: sabotage '%s' recorded zero scenarios; "
                "the suite cannot be trusted to go red" % mode,
                file=sys.stderr,
            )
            sys.exit(1)
        if not failed:
            print(
                "SABOTAGE VERDICT ERROR: sabotage '%s' recorded 0 failed scenarios "
                "(%d skipped); sabotage must produce recorded errors, not skips"
                % (mode, len(skipped)),
                file=sys.stderr,
            )
            sys.exit(1)
        for scenario in failed:
            print(
                "SABOTAGE VERDICT: sabotage '%s' failed scenario %r"
                % (mode, scenario.get("name", "Unnamed Scenario")),
                file=sys.stderr,
            )
        print(
            "SABOTAGE VERDICT OK: sabotage '%s' recorded %d failed scenario(s)"
            % (mode, len(failed)),
            file=sys.stderr,
        )
        SABOTAGE_VERDICT
          if ! find /tmp/results -type d -name 'faillog_*' | grep -q .; then
            echo "SABOTAGE VERDICT ERROR: no kde_faillog_* bundle was retained for sabotage '${SABOTAGE_MODE}'" >&2
            SABOTAGE_VERDICT_RC=1
          fi
        fi

        if [[ "${ARTIFACT_RC}" -ne 0 ]]; then
          echo "ERROR: KDE evidence artifacts were not fully retained" >&2
          exit "${ARTIFACT_RC}"
        fi
        if [[ "${SABOTAGE_VERDICT_RC}" -ne 0 ]]; then
          echo "ERROR: Gate B sabotage verdict failed" >&2
          exit "${SABOTAGE_VERDICT_RC}"
        fi
        if [[ "${PUBLISH_RC}" -ne 0 ]]; then
          exit "${PUBLISH_RC}"
        fi
        if [[ "${SABOTAGE_MODE}" != "none" && "${BEHAVE_RC}" -eq 0 ]]; then
          echo "SABOTAGE FAILURE: ${SABOTAGE_MODE} unexpectedly passed" >&2
          exit 1
        fi
        exit "${BEHAVE_RC}"
    volumes:
    - name: workspace
      emptyDir:
        sizeLimit: 2Gi
    - name: ssh-key
      secret:
        secretName: "{{inputs.parameters.ssh-key-secret}}"
        defaultMode: 0400
    - name: results
      emptyDir:
        sizeLimit: 1Gi
    - name: results-store
      hostPath:
        path: /var/mnt/ghost-data/test-results
        type: DirectoryOrCreate
