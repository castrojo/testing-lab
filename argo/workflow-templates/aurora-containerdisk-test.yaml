apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: aurora-containerdisk-test
  namespace: argo
  annotations:
    description: Build the Aurora testing containerDisk and provision it in aurora-test.
spec:
  serviceAccountName: argo
  entrypoint: build-and-provision
  onExit: teardown
  activeDeadlineSeconds: 14400
  arguments:
    parameters:
      - name: image-tag
        value: testing
      - name: vm-name
        value: aurora-containerdisk-{{workflow.uid}}
      - name: namespace
        value: aurora-test
  templates:
    - name: build-and-provision
      synchronization:
        semaphores:
          - configMapKeyRef:
              name: workflow-semaphores
              key: migration-containerdisk-build
      steps:
        - - name: build
            templateRef:
              name: build-bluefin-migration-containerdisk
              template: build-containerdisk
            arguments:
              parameters:
                - name: image
                  value: ghcr.io/ublue-os/aurora
                - name: image-tag
                  value: '{{workflow.parameters.image-tag}}'
                - name: containerdisk-tag
                  value: '{{workflow.parameters.image-tag}}'
                - name: disk-size
                  value: 30G
                - name: containerdisk-repo
                  value: aurora-containerdisk
                - name: prebake-kde-webdriver
                  value: "true"
                - name: force
                  value: "true"
        - - name: provision
            templateRef:
              name: provision-containerdisk-vm
              template: provision-vm
            arguments:
              parameters:
                - name: image-tag
                  value: '{{workflow.parameters.image-tag}}'
                - name: vm-name
                  value: '{{workflow.parameters.vm-name}}'
                - name: namespace
                  value: '{{workflow.parameters.namespace}}'
                - name: containerdisk-repo
                  value: aurora-containerdisk
                - name: app-label
                  value: aurora-test
                - name: label-prefix
                  value: aurora.io
    - name: teardown
      script:
        image: cgr.dev/chainguard/kubectl:latest-dev
        command: [bash]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        source: |
          set -e
          kubectl delete vm "{{workflow.parameters.vm-name}}" \
            -n "{{workflow.parameters.namespace}}" --ignore-not-found
