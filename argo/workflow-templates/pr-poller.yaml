apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: pr-poller
  namespace: argo
  labels:
    app.kubernetes.io/component: pr-poller
    app.kubernetes.io/part-of: bluefin-test-suite
spec:
  arguments:
    parameters:
      - name: refresh-existing
        value: "false"
      - name: repository
        value: ""
      - name: commit-sha
        value: ""
      - name: pr-number
        value: ""
      - name: image
        value: ""
      - name: image-tag
        value: ""
      - name: image-digest
        value: ""
      - name: suites
        value: ""
      - name: variant
        value: ""
      - name: branch
        value: ""
      - name: testsuite-branch
        value: ""
      - name: testsuite-repo
        value: ""
  serviceAccountName: argo
  metrics:
    prometheus:
      - name: lab_build_workflow_completed_total
        help: Completed lab build workflows by pipeline and status.
        labels:
          - key: pipeline
            value: pr-poller
          - key: status
            value: "{{workflow.status}}"
        counter:
          value: "1"
      - name: lab_build_workflow_duration_seconds
        help: Lab build workflow duration in seconds by pipeline and status.
        labels:
          - key: pipeline
            value: pr-poller
          - key: status
            value: "{{workflow.status}}"
        histogram:
          buckets: [300, 900, 1800, 3600, 7200, 14400, 28800, 43200, 86400]
          value: "{{workflow.duration}}"

  entrypoint: poll-labeled-prs
  templates:
    - name: poll-labeled-prs
      metadata:
        labels:
          app.kubernetes.io/part-of: bluefin-test-suite
          bluefin.io/step: pr-poller
      script:
        image: ghcr.io/projectbluefin/lab-runner:latest
        command: [bash]
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        env:
          - name: GITHUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-token
                key: token
          - name: REFRESH_EXISTING
            value: "{{workflow.parameters.refresh-existing}}"
        source: |
          set -euo pipefail

          # Bootstrap kubectl if not in PATH
          if ! command -v kubectl >/dev/null 2>&1; then
            KUBECTL=/tmp/kubectl
            if [ ! -f "${KUBECTL}" ]; then
              curl -sfL "https://dl.k8s.io/release/v1.32.0/bin/linux/amd64/kubectl" -o "${KUBECTL}"
              chmod +x "${KUBECTL}"
            fi
            kubectl() { "${KUBECTL}" "$@"; }
          fi

          API="https://api.github.com"
          ARGO_WORKFLOW_URL_BASE="http://192.168.1.102:2746/workflows/argo"
          # Max new dispatches per run — prevents burst storms when many PRs are in
          # failure state after a cluster outage. Sized in *workflows*, not slots:
          # since #612 each QA pipeline template carries `parallelism: 2`, so one
          # workflow holds at most 2 of the 6 `ghost-container-qa` slots and the
          # runner executes 6 / 2 = 3 workflows concurrently. Admitting more than
          # that per 5-minute poll cannot make anything finish sooner; it only
          # deepens the queue. Keep this <= ghost-container-qa / pipeline
          # parallelism (asserted in tests/unit/test_pr_poller_reaper.py).
          MAX_DISPATCH=3
          DISPATCHED=0

          # Open PRs seen this run, keyed "<product>/<number>". Populated from
          # the GitHub search results and used by the reaper below.
          declare -A OPEN_PRS=()
          # Products whose open-PR enumeration completed with zero API errors.
          # The reaper only acts on these, so a transient GitHub outage can
          # never be mistaken for "every PR was merged".
          declare -A SCAN_HEALTHY=()

          # Graceful cancellation. `spec.shutdown: Stop` is what `argo stop`
          # sets: running pods are terminated but the `onExit` handler still
          # runs, so `report-final` publishes a terminal ghost-lab status
          # instead of leaving the commit stuck on `pending`. A hard
          # `kubectl delete` would skip onExit and strand the status.
          stop_workflow() {
            local wf="$1" reason="$2"
            if kubectl patch workflow "${wf}" -n argo --type merge \
                 -p '{"spec":{"shutdown":"Stop"}}' >/dev/null 2>&1; then
              echo "reaper: stopped ${wf} — ${reason}" >&2
            else
              echo "reaper: could not stop ${wf} (${reason}); will retry next poll" >&2
            fi
          }

          # In-flight poller-dispatched workflows for a product, as
          # "<name> <pr-number> <pr-sha>" lines. Completed workflows and ones
          # already shutting down are excluded so the reaper is idempotent.
          # Workflows without a bluefin.io/repository label are ignored entirely:
          # PR numbers collide across repositories, so an unlabelled workflow can
          # never be safely attributed.
          inflight_workflows() {
            local product="$1"
            kubectl get workflows -n argo \
              -l "bluefin.io/trigger=pr-auto,bluefin.io/repository=${product}" \
              -o json 2>/dev/null \
              | jq -r '.items[]
                  | select((.metadata.labels["workflows.argoproj.io/completed"] // "false") != "true")
                  | select((.spec.shutdown // "") == "")
                  | select((.metadata.labels["bluefin.io/pr-number"] // "") != "")
                  | "\(.metadata.name) \(.metadata.labels["bluefin.io/pr-number"]) \(.metadata.labels["bluefin.io/pr-sha"] // "")"'
          }

          # Newest SHA wins: stop any in-flight workflow for this PR whose head
          # SHA differs from the one being dispatched. Without this, a push
          # leaves the superseded run holding a ghost-container-qa slot for its
          # full ~20 minutes producing a result nobody will read.
          stop_superseded_workflows() {
            local product="$1" pr_num="$2" sha12="$3"
            local wf pr sha
            while read -r wf pr sha; do
              [[ -z "${wf}" ]] && continue
              [[ "${pr}" != "${pr_num}" ]] && continue
              [[ "${sha}" == "${sha12}" ]] && continue
              stop_workflow "${wf}" "superseded by ${product} PR #${pr_num} ${sha12}"
            done < <(inflight_workflows "${product}")
          }

          dispatch_lab_check() {
            local repo="$1"
            local sha="$2"
            local pr_number="$3"
            local state="$4"
            local conclusion="$5"
            local workflow_name="$6"
            local workflow_url="$7"
            local title="$8"
            local summary="$9"

            payload=$(
              jq -n \
                --arg repository "${repo}" \
                --arg sha "${sha}" \
                --arg pr_number "${pr_number}" \
                --arg state "${state}" \
                --arg conclusion "${conclusion}" \
                --arg external_id "${workflow_name}" \
                --arg details_url "${workflow_url}" \
                --arg title "${title}" \
                --arg summary "${summary}" \
                '{
                  event_type: "lab-check",
                  client_payload: {
                    repository: $repository,
                    sha: $sha,
                    check: {
                      pr_number: $pr_number,
                      state: $state,
                      conclusion: $conclusion,
                      external_id: $external_id,
                      details_url: $details_url,
                      title: $title,
                      summary: $summary,
                      text: "",
                      started_at: "",
                      completed_at: ""
                    }
                  }
                }'
            )

            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API}/repos/${repo}/dispatches" \
              --data-binary "${payload}" \
              -o /dev/null
          }

          # Repos tested on every PR — no label required. Bluefin, Bluefin LTS,
          # and Dakota are deliberately NOT here: the container QA lane they
          # would use fails 100% of the time today, so auto-dispatching them
          # only paints failing ghost-lab statuses on every open pull request.
          # Restore them once a lane is observed passing end to end. An
          # operator can still opt an individual PR in with test-on-lab.
          AUTO_REPOS=(
           "projectbluefin/common"
           "projectbluefin/knuckle"
           "projectbluefin/testsuite"
          )

          dispatch_pr() {
           local PR="$1"
           local REPO SHA PR_NUM HEAD_BRANCH BRANCH TESTSUITE_BRANCH EXISTING TMPL TITLE TITLE_SLUG
           local PRODUCT DISPLAY_NAME PR_IMAGE PR_IMAGE_TAG PR_SUITES BST_WORKLOAD REPORTER

           REPO=$(echo "$PR" | jq -r '.base.repo.full_name')
           SHA=$(echo "$PR"  | jq -r '.head.sha')
           PR_NUM=$(echo "$PR" | jq -r '.number')
           # Repository slug used for the bluefin.io/repository label. PR numbers
           # collide across repositories, so every label selector that keys on
           # pr-number must also key on this.
           PRODUCT="${REPO##*/}"
           SHA12="${SHA:0:12}"

           # Newest SHA wins. Runs before the dispatch cap and before the dedup
           # guard: superseding is about this PR's *current* head, not about
           # whether we dispatch anything this poll. Without it a push leaves the
           # old run holding a ghost-container-qa slot for its full ~20 minutes
           # producing a result nobody will read.
           stop_superseded_workflows "${PRODUCT}" "${PR_NUM}" "${SHA12}"

           # Rate-limit: stop dispatching once we hit MAX_DISPATCH this run
           if [[ "$DISPATCHED" -ge "$MAX_DISPATCH" ]]; then
             echo "PR #${PR_NUM} ${REPO}: dispatch cap (${MAX_DISPATCH}) reached, deferring to next run" >&2
             return
           fi

           # Dedup: one workflow per PR head SHA by default. Refresh mode
           # bypasses this guard so an operator can force a fresh run for an
           # already-open PR without waiting for a new commit.
           if [[ "${REFRESH_EXISTING}" == "true" ]]; then
             kubectl delete workflow -n argo -l "bluefin.io/pr-number=${PR_NUM},bluefin.io/pr-sha=${SHA12}" --ignore-not-found >/dev/null 2>&1 || true
             echo "PR #${PR_NUM} ${REPO}: refresh mode enabled, re-dispatching ${SHA12}" >&2
           else
             EXISTING=$(kubectl get workflows -n argo \
               -l "bluefin.io/pr-number=${PR_NUM},bluefin.io/pr-sha=${SHA12}" \
               --no-headers 2>/dev/null | wc -l)
             if [[ "$EXISTING" -gt 0 ]]; then
               echo "PR #${PR_NUM} ${REPO}: workflow for ${SHA12} already exists (${EXISTING}), skipping" >&2
               return
             fi
           fi

           HEAD_BRANCH=$(echo "$PR" | jq -r '.head.ref')
           HEAD_REPO=$(echo "$PR" | jq -r '.head.repo.clone_url')
           # Testsuite PRs run their exact head repository and branch. Other
           # repositories use the canonical testsuite main branch.
           if [[ "$REPO" == "projectbluefin/testsuite" ]]; then
            TESTSUITE_BRANCH="$HEAD_BRANCH"
            TESTSUITE_REPO="$HEAD_REPO"
           else
            TESTSUITE_BRANCH="main"
            TESTSUITE_REPO="https://github.com/projectbluefin/testsuite"
           fi
           BRANCH="$TESTSUITE_BRANCH"
           REPO_SLUG=$(echo "$REPO" | sed 's|.*/||; s/bluefin-lts/lts/; s/bluefin/blu/; s/dakota/dak/; s/knuckle/knu/; s/bazzite/baz/; s/aurora/aur/')
           TITLE=$(echo "$PR" | jq -r '.title')
           # Slugify title: lowercase, non-alnum to dash, truncate to 30 chars
           TITLE_SLUG=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/-/g; s/--*/-/g; s/^-//; s/-$//' \
            | cut -c1-30 | sed 's/-$//')

           # Route to matching WorkflowTemplate + derive per-repo params
           case "$REPO" in
            */dakota)       TMPL="dakota-build-qa"
                            EXTRA_PARAMS="" ;;
            */knuckle)      TMPL="knuckle-qa-pipeline"
                            EXTRA_PARAMS="" ;;
            */bazzite)      TMPL="bluefin-qa-pipeline"
                            EXTRA_PARAMS="
               - name: image
                 value: ghcr.io/ublue-os/bazzite
               - name: image-tag
                 value: testing
               - name: suites
                 value: system
               - name: variant
                 value: bazzite
               - name: testsuite-branch
                 value: ${TESTSUITE_BRANCH}
               - name: testsuite-repo
                 value: ${TESTSUITE_REPO}" ;;
            */aurora)       TMPL="bluefin-qa-pipeline"
                            EXTRA_PARAMS="
               - name: image
                 value: ghcr.io/ublue-os/aurora
               - name: image-tag
                 value: testing
               - name: suites
                 value: system
               - name: variant
                 value: aurora
               - name: testsuite-branch
                 value: ${TESTSUITE_BRANCH}
               - name: testsuite-repo
                 value: ${TESTSUITE_REPO}" ;;
            */bluefin-lts)  TMPL="bluefin-qa-pipeline"
                            EXTRA_PARAMS="
               - name: image
                 value: ghcr.io/projectbluefin/bluefin-lts
               - name: image-tag
                 value: testing
               - name: suites
                 value: smoke
               - name: variant
                 value: bluefin-lts
               - name: testsuite-branch
                 value: ${TESTSUITE_BRANCH}
               - name: testsuite-repo
                 value: ${TESTSUITE_REPO}" ;;
            */testsuite)    TMPL="bluefin-qa-pipeline"
                             # Run smoke + common against bluefin:testing using
                             # the PR branch so the new/changed scenarios are exercised.
                             EXTRA_PARAMS="
               - name: image-tag
                 value: testing
               - name: suites
                 value: smoke,common
               - name: testsuite-branch
                 value: ${TESTSUITE_BRANCH}
               - name: testsuite-repo
                 value: ${TESTSUITE_REPO}" ;;
            *)              TMPL="bluefin-qa-pipeline"
                            # bluefin/common: smoke only to limit workload size
                            EXTRA_PARAMS="
               - name: image-tag
                 value: testing
               - name: suites
                 value: smoke
               - name: testsuite-branch
                 value: ${TESTSUITE_BRANCH}
               - name: testsuite-repo
                 value: ${TESTSUITE_REPO}" ;;
           esac

           if [[ "$REPO" == "projectbluefin/bluefin" ||
                 "$REPO" == "projectbluefin/bluefin-lts" ||
                 "$REPO" == "projectbluefin/dakota" ||
                 "$REPO" == "projectbluefin/testsuite" ]]; then
            REPORTER="github-check-reporter"
            case "${PRODUCT}" in
              dakota)
                DISPLAY_NAME="Dakota"
                PR_IMAGE="192.168.1.102:30500/dakota"
                PR_IMAGE_TAG="${SHA}"
                PR_SUITES="smoke,common,developer,software,system"
                BST_WORKLOAD="true"
                ACTIVE_BST=$(
                  kubectl get workflows -n argo \
                    -l bluefin.io/bst-workload=true \
                    -o json \
                    | jq '[.items[] | select(.status.phase == "Running")] | length'
                )
                if (( ACTIVE_BST >= 2 )); then
                  echo "PR #${PR_NUM} ${REPO}: BST queue full (${ACTIVE_BST}/2); deferring to the next poll" >&2
                  return
                fi
                ;;
              bluefin)
                DISPLAY_NAME="Bluefin"
                PR_IMAGE="ghcr.io/projectbluefin/bluefin"
                PR_IMAGE_TAG="testing"
                PR_SUITES="smoke"
                BST_WORKLOAD="false"
                ;;
              bluefin-lts)
                DISPLAY_NAME="Bluefin LTS"
                PR_IMAGE="ghcr.io/projectbluefin/bluefin-lts"
                PR_IMAGE_TAG="testing"
                PR_SUITES="smoke"
                BST_WORKLOAD="false"
                ;;
              testsuite)
                DISPLAY_NAME="Testsuite"
                PR_IMAGE="ghcr.io/projectbluefin/bluefin"
                PR_IMAGE_TAG="testing"
                PR_SUITES="smoke,common"
                BST_WORKLOAD="false"
                REPORTER="github-status-reporter"
                ;;
            esac
            # Build literal Argo expressions for the generated child workflow
            # without exposing double braces to this outer template.
            ARGO_OPEN=$(printf '\x7b\x7b')
            ARGO_CLOSE=$(printf '\x7d\x7d')
            WORKFLOW_NAME=$(kubectl create -f - -o jsonpath='{.metadata.name}' <<EOF
          apiVersion: argoproj.io/v1alpha1
          kind: Workflow
          metadata:
           generateName: "${REPO_SLUG}-${PR_NUM}-${TITLE_SLUG}-"
           namespace: argo
           labels:
             bluefin.io/trigger: pr-auto
             bluefin.io/pr-number: "${PR_NUM}"
             bluefin.io/pr-sha: "${SHA12}"
             bluefin.io/repository: "${PRODUCT}"
             bluefin.io/bst-workload: "${BST_WORKLOAD}"
          spec:
           serviceAccountName: argo
           activeDeadlineSeconds: 90000
           entrypoint: pr-pipeline
           onExit: report-final
           arguments:
             parameters:
               - name: repository
                 value: "${REPO}"
               - name: pr-number
                 value: "${PR_NUM}"
               - name: commit-sha
                 value: "${SHA}"
               - name: image
                 value: "${PR_IMAGE}"
               - name: image-tag
                 value: "${PR_IMAGE_TAG}"
               - name: image-digest
                 value: ""
               - name: suites
                 value: "${PR_SUITES}"
               - name: variant
                 value: "${PRODUCT}"
               - name: branch
                 value: "${BRANCH}"
               - name: testsuite-branch
                 value: "${TESTSUITE_BRANCH}"
               - name: testsuite-repo
                 value: "${TESTSUITE_REPO}"
           templates:
             - name: pr-pipeline
               dag:
                 tasks:
                   - name: report-start
                     templateRef:
                       name: ${REPORTER}
                       template: send
                     arguments:
                       parameters:
                         - name: repository
                           value: "${ARGO_OPEN}workflow.parameters.repository${ARGO_CLOSE}"
                         - name: sha
                           value: "${ARGO_OPEN}workflow.parameters.commit-sha${ARGO_CLOSE}"
                         - name: pr-number
                           value: "${ARGO_OPEN}workflow.parameters.pr-number${ARGO_CLOSE}"
                         - name: state
                           value: in_progress
                         - name: conclusion
                           value: ""
                         - name: workflow-name
                           value: "${ARGO_OPEN}workflow.name${ARGO_CLOSE}"
                         - name: workflow-url
                           value: "${ARGO_WORKFLOW_URL_BASE}/${ARGO_OPEN}workflow.name${ARGO_CLOSE}"
                         - name: title
                           value: ${DISPLAY_NAME} lab validation is running
                         - name: summary
                           value: |
                             The lab admitted PR #${PR_NUM} at commit \`${SHA}\`.

                             Validation is running in Argo workflow \`${ARGO_OPEN}workflow.name${ARGO_CLOSE}\`.
                         - name: text
                           value: ""
                         - name: started-at
                           value: ""
                         - name: completed-at
                           value: ""
                   - name: build
                     depends: "(report-start.Succeeded || report-start.Failed || report-start.Errored)"
                     when: "'${ARGO_OPEN}workflow.parameters.repository${ARGO_CLOSE}' == 'projectbluefin/dakota'"
                     templateRef:
                       name: dakota-build-pipeline
                       template: build
                     arguments:
                       parameters:
                         - name: ref
                           value: "testing"
                         - name: commit-sha
                           value: "${SHA}"
                         - name: repo
                           value: "https://github.com/${REPO}.git"
                         - name: image-tag
                           value: "${SHA}"
                         - name: registry
                           value: "192.168.1.102:30500"
                         - name: build-mode
                           value: "re"
                         - name: lock-key
                           value: "bst-build"
                   - name: qa-dakota
                     depends: "build.Succeeded"
                     when: "'${ARGO_OPEN}workflow.parameters.repository${ARGO_CLOSE}' == 'projectbluefin/dakota'"
                     templateRef:
                       name: dakota-qa-pipeline
                       template: pipeline
                     arguments:
                       parameters:
                         - name: image
                           value: "${ARGO_OPEN}workflow.parameters.image${ARGO_CLOSE}"
                         - name: image-tag
                           value: "${ARGO_OPEN}workflow.parameters.image-tag${ARGO_CLOSE}"
                         - name: image-digest
                           value: "${ARGO_OPEN}workflow.parameters.image-digest${ARGO_CLOSE}"
                         - name: suites
                           value: "${ARGO_OPEN}workflow.parameters.suites${ARGO_CLOSE}"
                         - name: variant
                           value: "${ARGO_OPEN}workflow.parameters.variant${ARGO_CLOSE}"
                         - name: branch
                           value: "${ARGO_OPEN}workflow.parameters.branch${ARGO_CLOSE}"
                         - name: testsuite-branch
                           value: "${ARGO_OPEN}workflow.parameters.testsuite-branch${ARGO_CLOSE}"
                         - name: testsuite-repo
                           value: "${ARGO_OPEN}workflow.parameters.testsuite-repo${ARGO_CLOSE}"
                   - name: qa-bluefin
                     depends: "(report-start.Succeeded || report-start.Failed || report-start.Errored)"
                     when: "'${ARGO_OPEN}workflow.parameters.repository${ARGO_CLOSE}' != 'projectbluefin/dakota'"
                     templateRef:
                       name: bluefin-qa-pipeline
                       template: pipeline
                     arguments:
                       parameters:
                          - name: image
                            value: "${ARGO_OPEN}workflow.parameters.image${ARGO_CLOSE}"
                          - name: image-tag
                            value: "${ARGO_OPEN}workflow.parameters.image-tag${ARGO_CLOSE}"
                          - name: suites
                            value: "${ARGO_OPEN}workflow.parameters.suites${ARGO_CLOSE}"
                          - name: variant
                            value: "${ARGO_OPEN}workflow.parameters.variant${ARGO_CLOSE}"
                          - name: branch
                            value: "${ARGO_OPEN}workflow.parameters.branch${ARGO_CLOSE}"
                          - name: pr-number
                            value: "${ARGO_OPEN}workflow.parameters.pr-number${ARGO_CLOSE}"
                          - name: sha
                            value: "${ARGO_OPEN}workflow.parameters.commit-sha${ARGO_CLOSE}"
                          - name: repo
                            value: "${ARGO_OPEN}workflow.parameters.repository${ARGO_CLOSE}"
                          - name: testsuite-branch
                            value: "${ARGO_OPEN}workflow.parameters.testsuite-branch${ARGO_CLOSE}"
                          - name: testsuite-repo
                            value: "${ARGO_OPEN}workflow.parameters.testsuite-repo${ARGO_CLOSE}"
             - name: report-final
               steps:
                 - - name: github-check
                     templateRef:
                       name: ${REPORTER}
                       template: final
                     arguments:
                       parameters:
                         - name: repository
                           value: "${ARGO_OPEN}workflow.parameters.repository${ARGO_CLOSE}"
                         - name: sha
                           value: "${ARGO_OPEN}workflow.parameters.commit-sha${ARGO_CLOSE}"
                         - name: pr-number
                           value: "${ARGO_OPEN}workflow.parameters.pr-number${ARGO_CLOSE}"
                         - name: final-status
                           value: "${ARGO_OPEN}workflow.status${ARGO_CLOSE}"
                         - name: workflow-url
                           value: "${ARGO_WORKFLOW_URL_BASE}/${ARGO_OPEN}workflow.name${ARGO_CLOSE}"
          EOF
            )
            WORKFLOW_URL="${ARGO_WORKFLOW_URL_BASE}/${WORKFLOW_NAME}"
            if [[ "${REPORTER}" == "github-status-reporter" ]]; then
              echo "PR #${PR_NUM} ${REPO}: queued status will be published by ${WORKFLOW_NAME}" >&2
            elif ! dispatch_lab_check \
              "${REPO}" \
              "${SHA}" \
              "${PR_NUM}" \
              queued \
              "" \
              "${WORKFLOW_NAME}" \
              "${WORKFLOW_URL}" \
              "${DISPLAY_NAME} lab validation queued" \
              "The lab queued PR #${PR_NUM} at commit \`${SHA}\` as Argo workflow \`${WORKFLOW_NAME}\`."; then
              echo "PR #${PR_NUM} ${REPO}: failed to create queued GitHub check; deleting ${WORKFLOW_NAME} so the next poll retries" >&2
              kubectl delete workflow "${WORKFLOW_NAME}" -n argo --ignore-not-found
              return 0
            fi
            echo "PR #${PR_NUM} ${REPO}: dispatched ${WORKFLOW_NAME} and queued MergeRaptor check for ${SHA12}" >&2
           else
             kubectl create -f - <<EOF
          apiVersion: argoproj.io/v1alpha1
          kind: Workflow
          metadata:
           generateName: "${REPO_SLUG}-${PR_NUM}-${TITLE_SLUG}-"
           namespace: argo
           labels:
             bluefin.io/trigger: pr-auto
             bluefin.io/pr-number: "${PR_NUM}"
             bluefin.io/pr-sha: "${SHA12}"
             bluefin.io/repository: "${PRODUCT}"
          spec:
           workflowTemplateRef:
             name: ${TMPL}
           arguments:
             parameters:
               - name: sha
                 value: "${SHA}"
               - name: repo
                 value: "${REPO}"
               - name: branch
                 value: "${BRANCH}"
               - name: pr-number
                 value: "${PR_NUM}"${EXTRA_PARAMS}
          EOF
             echo "PR #${PR_NUM} ${REPO}: dispatched ${TMPL}" >&2
           fi
           (( DISPATCHED++ )) || true
          }

          # --- Pass 1: every open PR in auto-test repos ---
          for REPO in "${AUTO_REPOS[@]}"; do
           REPO_QUERY=$(jq -rn --arg q "repo:${REPO} is:pr is:open" '$q|@uri')
           REPO_PRODUCT="${REPO##*/}"
           PAGE=1
           # Every GitHub call for this repo must succeed before the reaper is
           # allowed to treat "absent from OPEN_PRS" as "PR is closed".
           SCAN_OK=1
           SEEN_OPEN=0
           while true; do
             RESULTS=$(curl -sf \
               -H "Authorization: token ${GITHUB_TOKEN}" \
               -H "Accept: application/vnd.github+json" \
               "${API}/search/issues?q=${REPO_QUERY}&per_page=30&page=${PAGE}") || {
                 echo "Repo ${REPO}: open-PR search failed on page ${PAGE}; skipping reap this run" >&2
                 SCAN_OK=0
                 break
               }
             COUNT=$(echo "$RESULTS" | jq '.total_count // 0')
             ITEMS=$(echo "$RESULTS" | jq '.items | length')
             [[ "$ITEMS" -eq 0 ]] && break
             echo "Repo ${REPO}: ${COUNT} open PR(s), page ${PAGE}, ${ITEMS} items" >&2
             # Record the open set from the search payload itself, so a failed
             # per-PR detail fetch can never make a live PR look closed.
             while read -r open_num; do
               OPEN_PRS["${REPO_PRODUCT}/${open_num}"]=1
               SEEN_OPEN=1
             done < <(echo "$RESULTS" | jq -r '.items[].number')
             while read -r item; do
               PR_URL=$(echo "$item" | jq -r '.pull_request.url')
               PR=$(curl -sf \
                 -H "Authorization: token ${GITHUB_TOKEN}" \
                 -H "Accept: application/vnd.github+json" \
                 "$PR_URL") || {
                   echo "Repo ${REPO}: PR detail fetch failed for ${PR_URL}; skipping reap this run" >&2
                   SCAN_OK=0
                   continue
                 }
               dispatch_pr "$PR"
             done < <(echo "$RESULTS" | jq -c '.items[]')
             [[ "$ITEMS" -lt 30 ]] && break
             (( PAGE++ ))
           done
           # Require at least one observed open PR. A repo that suddenly reports
           # zero open PRs is far more likely to be an auth/scope regression than
           # a genuine mass merge, and reaping on it would cancel every live run.
           if [[ "$SCAN_OK" == "1" && "$SEEN_OPEN" == "1" ]]; then
             SCAN_HEALTHY["${REPO_PRODUCT}"]=1
           fi
          done

          # --- Pass 2: label-based catch-all for projectbluefin repos ---
          LABEL_QUERY=$(jq -rn --arg q "org:projectbluefin is:pr is:open label:test-on-lab" '$q|@uri')
          LABEL_RESULTS=$(curl -sf \
           -H "Authorization: token ${GITHUB_TOKEN}" \
           -H "Accept: application/vnd.github+json" \
           "${API}/search/issues?q=${LABEL_QUERY}")
          LABEL_COUNT=$(echo "$LABEL_RESULTS" | jq '.total_count // 0')
          echo "Found ${LABEL_COUNT} PR(s) with test-on-lab label" >&2
          if [[ "$LABEL_COUNT" -gt 0 ]]; then
           while read -r item; do
             PR_URL=$(echo "$item" | jq -r '.pull_request.url')
             PR=$(curl -sf \
               -H "Authorization: token ${GITHUB_TOKEN}" \
               -H "Accept: application/vnd.github+json" \
               "$PR_URL")
             dispatch_pr "$PR"
           done < <(echo "$LABEL_RESULTS" | jq -c '.items[]')
          fi

          # --- Pass 3: reap workflows whose PR is no longer open ---
          # A merged or closed PR keeps its workflow running for the full ~20
          # minutes, holding a ghost-container-qa slot to produce a result nobody
          # will read. Cancel gracefully so `report-final` still publishes a
          # terminal ghost-lab status.
          #
          # Safety: only products whose open-PR enumeration completed with zero
          # API errors AND returned at least one open PR are eligible, and only
          # workflows carrying a bluefin.io/repository label are considered.
          # Re-running this every 5 minutes is a no-op once a workflow has
          # spec.shutdown set.
          for REPO in "${AUTO_REPOS[@]}"; do
           REPO_PRODUCT="${REPO##*/}"
           if [[ -z "${SCAN_HEALTHY[${REPO_PRODUCT}]:-}" ]]; then
             echo "reaper: skipping ${REPO}; open-PR enumeration was incomplete this run" >&2
             continue
           fi
           while read -r WF WF_PR WF_SHA; do
             [[ -z "${WF}" ]] && continue
             [[ -n "${OPEN_PRS[${REPO_PRODUCT}/${WF_PR}]:-}" ]] && continue
             stop_workflow "${WF}" "${REPO} PR #${WF_PR} (${WF_SHA}) is merged or closed"
           done < <(inflight_workflows "${REPO_PRODUCT}")
          done