apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: pr-poller
  namespace: argo
  labels:
    app.kubernetes.io/component: pr-poller
    app.kubernetes.io/part-of: bluefin-test-suite
spec:
  serviceAccountName: argo
  entrypoint: poll-labeled-prs
  templates:
    - name: poll-labeled-prs
      metadata:
        labels:
          app.kubernetes.io/part-of: bluefin-test-suite
          bluefin.io/step: pr-poller
      script:
        image: ghcr.io/projectbluefin/lab-runner:latest
        command: [bash]
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        env:
          - name: GITHUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-token
                key: token
        source: |
          set -euo pipefail

          # Bootstrap kubectl if not in PATH
          if ! command -v kubectl >/dev/null 2>&1; then
            KUBECTL=/tmp/kubectl
            if [ ! -f "${KUBECTL}" ]; then
              curl -sfL "https://dl.k8s.io/release/v1.32.0/bin/linux/amd64/kubectl" -o "${KUBECTL}"
              chmod +x "${KUBECTL}"
            fi
            kubectl() { "${KUBECTL}" "$@"; }
          fi

          API="https://api.github.com"
          ARGO_WORKFLOW_URL_BASE="http://192.168.1.102:2746/workflows/argo"
          # Max new dispatches per run — prevents burst storms when many PRs are in
          # failure state after a cluster outage.
          MAX_DISPATCH=8
          DISPATCHED=0

          dispatch_lab_check() {
            local repo="$1"
            local sha="$2"
            local pr_number="$3"
            local state="$4"
            local conclusion="$5"
            local workflow_name="$6"
            local workflow_url="$7"
            local title="$8"
            local summary="$9"

            payload=$(
              jq -n \
                --arg repository "${repo}" \
                --arg sha "${sha}" \
                --arg pr_number "${pr_number}" \
                --arg state "${state}" \
                --arg conclusion "${conclusion}" \
                --arg external_id "${workflow_name}" \
                --arg details_url "${workflow_url}" \
                --arg title "${title}" \
                --arg summary "${summary}" \
                '{
                  event_type: "lab-check",
                  client_payload: {
                    repository: $repository,
                    sha: $sha,
                    check: {
                      pr_number: $pr_number,
                      state: $state,
                      conclusion: $conclusion,
                      external_id: $external_id,
                      details_url: $details_url,
                      title: $title,
                      summary: $summary,
                      text: "",
                      started_at: "",
                      completed_at: ""
                    }
                  }
                }'
            )

            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API}/repos/${repo}/dispatches" \
              --data-binary "${payload}" \
              -o /dev/null
          }

          # Repos tested on every PR — no label required.
          AUTO_REPOS=(
           "projectbluefin/common"
           "projectbluefin/bluefin"
           "projectbluefin/bluefin-lts"
           "projectbluefin/dakota"
           "projectbluefin/knuckle"
           "projectbluefin/testsuite"
          )

          dispatch_pr() {
           local PR="$1"
           local REPO SHA PR_NUM HEAD_BRANCH BRANCH TESTSUITE_BRANCH EXISTING TMPL TITLE TITLE_SLUG
           local PRODUCT DISPLAY_NAME PR_IMAGE PR_IMAGE_TAG PR_SUITES BST_WORKLOAD

           # Rate-limit: stop dispatching once we hit MAX_DISPATCH this run
           if [[ "$DISPATCHED" -ge "$MAX_DISPATCH" ]]; then
             REPO=$(echo "$PR" | jq -r '.base.repo.full_name')
             PR_NUM=$(echo "$PR" | jq -r '.number')
             echo "PR #${PR_NUM} ${REPO}: dispatch cap (${MAX_DISPATCH}) reached, deferring to next run" >&2
             return
           fi

           REPO=$(echo "$PR" | jq -r '.base.repo.full_name')
           SHA=$(echo "$PR"  | jq -r '.head.sha')
           PR_NUM=$(echo "$PR" | jq -r '.number')

           # Dedup: one workflow per PR head SHA — ever. Without this the
           # poller re-dispatched every open PR on every cycle, flooding the
           # cluster with duplicate runs. To force a re-test of the same SHA,
           # delete the old workflow (kubectl delete wf -n argo -l
           # bluefin.io/pr-sha=<sha12>) or push a new commit.
           SHA12="${SHA:0:12}"
           EXISTING=$(kubectl get workflows -n argo \
             -l "bluefin.io/pr-number=${PR_NUM},bluefin.io/pr-sha=${SHA12}" \
             --no-headers 2>/dev/null | wc -l)
           if [[ "$EXISTING" -gt 0 ]]; then
             echo "PR #${PR_NUM} ${REPO}: workflow for ${SHA12} already exists (${EXISTING}), skipping" >&2
             return
           fi

           HEAD_BRANCH=$(echo "$PR" | jq -r '.head.ref')
           HEAD_REPO=$(echo "$PR" | jq -r '.head.repo.clone_url')
           # Testsuite PRs run their exact head repository and branch. Other
           # repositories use the canonical testsuite main branch.
           if [[ "$REPO" == "projectbluefin/testsuite" ]]; then
            TESTSUITE_BRANCH="$HEAD_BRANCH"
            TESTSUITE_REPO="$HEAD_REPO"
           else
            TESTSUITE_BRANCH="main"
            TESTSUITE_REPO="https://github.com/projectbluefin/testsuite"
           fi
           BRANCH="$TESTSUITE_BRANCH"
           REPO_SLUG=$(echo "$REPO" | sed 's|.*/||; s/bluefin-lts/lts/; s/bluefin/blu/; s/dakota/dak/; s/knuckle/knu/; s/bazzite/baz/; s/aurora/aur/')
           TITLE=$(echo "$PR" | jq -r '.title')
           # Slugify title: lowercase, non-alnum to dash, truncate to 30 chars
           TITLE_SLUG=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/-/g; s/--*/-/g; s/^-//; s/-$//' \
            | cut -c1-30 | sed 's/-$//')

           # Route to matching WorkflowTemplate + derive per-repo params
           case "$REPO" in
            */dakota)       TMPL="dakota-build-qa"
                            EXTRA_PARAMS="" ;;
            */knuckle)      TMPL="knuckle-qa-pipeline"
                            EXTRA_PARAMS="" ;;
            */bazzite)      TMPL="bluefin-qa-pipeline"
                            EXTRA_PARAMS="
               - name: image
                 value: ghcr.io/ublue-os/bazzite
               - name: image-tag
                 value: testing
               - name: suites
                 value: system
               - name: variant
                 value: bazzite
               - name: testsuite-branch
                 value: ${TESTSUITE_BRANCH}
               - name: testsuite-repo
                 value: ${TESTSUITE_REPO}" ;;
            */aurora)       TMPL="bluefin-qa-pipeline"
                            EXTRA_PARAMS="
               - name: image
                 value: ghcr.io/ublue-os/aurora
               - name: image-tag
                 value: testing
               - name: suites
                 value: system
               - name: variant
                 value: aurora
               - name: testsuite-branch
                 value: ${TESTSUITE_BRANCH}
               - name: testsuite-repo
                 value: ${TESTSUITE_REPO}" ;;
            */bluefin-lts)  TMPL="bluefin-qa-pipeline"
                            EXTRA_PARAMS="
               - name: image
                 value: ghcr.io/projectbluefin/bluefin-lts
               - name: image-tag
                 value: testing
               - name: suites
                 value: smoke
               - name: variant
                 value: bluefin-lts
               - name: testsuite-branch
                 value: ${TESTSUITE_BRANCH}
               - name: testsuite-repo
                 value: ${TESTSUITE_REPO}" ;;
            */testsuite)    TMPL="bluefin-qa-pipeline"
                             # Run smoke + common against bluefin:testing using
                             # the PR branch so the new/changed scenarios are exercised.
                             EXTRA_PARAMS="
               - name: image-tag
                 value: testing
               - name: suites
                 value: smoke,common
               - name: testsuite-branch
                 value: ${TESTSUITE_BRANCH}
               - name: testsuite-repo
                 value: ${TESTSUITE_REPO}" ;;
            *)              TMPL="bluefin-qa-pipeline"
                            # bluefin/common: smoke only to limit workload size
                            EXTRA_PARAMS="
               - name: image-tag
                 value: testing
               - name: suites
                 value: smoke
               - name: testsuite-branch
                 value: ${TESTSUITE_BRANCH}
               - name: testsuite-repo
                 value: ${TESTSUITE_REPO}" ;;
           esac

           if [[ "$REPO" == "projectbluefin/bluefin" ||
                 "$REPO" == "projectbluefin/bluefin-lts" ||
                 "$REPO" == "projectbluefin/dakota" ]]; then
            PRODUCT="${REPO##*/}"
            case "${PRODUCT}" in
              dakota)
                DISPLAY_NAME="Dakota"
                PR_IMAGE="192.168.1.102:30500/dakota"
                PR_IMAGE_TAG="${SHA}"
                PR_SUITES="smoke,common,developer,software,system"
                BST_WORKLOAD="true"
                ACTIVE_BST=$(
                  kubectl get workflows -n argo \
                    -l bluefin.io/bst-workload=true \
                    -o json \
                    | jq '[.items[] | select(.status.phase == "Running")] | length'
                )
                if (( ACTIVE_BST >= 2 )); then
                  echo "PR #${PR_NUM} ${REPO}: BST queue full (${ACTIVE_BST}/2); deferring to the next poll" >&2
                  return
                fi
                ;;
              bluefin)
                DISPLAY_NAME="Bluefin"
                PR_IMAGE="ghcr.io/projectbluefin/bluefin"
                PR_IMAGE_TAG="testing"
                PR_SUITES="smoke"
                BST_WORKLOAD="false"
                ;;
              bluefin-lts)
                DISPLAY_NAME="Bluefin LTS"
                PR_IMAGE="ghcr.io/projectbluefin/bluefin-lts"
                PR_IMAGE_TAG="testing"
                PR_SUITES="smoke"
                BST_WORKLOAD="false"
                ;;
            esac
            WORKFLOW_NAME=$(kubectl create -f - -o jsonpath='{.metadata.name}' <<EOF
          apiVersion: argoproj.io/v1alpha1
          kind: Workflow
          metadata:
           generateName: "${REPO_SLUG}-${PR_NUM}-${TITLE_SLUG}-"
           namespace: argo
           labels:
             bluefin.io/trigger: pr-auto
             bluefin.io/pr-number: "${PR_NUM}"
             bluefin.io/pr-sha: "${SHA12}"
             bluefin.io/repository: "${PRODUCT}"
             bluefin.io/bst-workload: "${BST_WORKLOAD}"
          spec:
           serviceAccountName: argo
           activeDeadlineSeconds: 90000
           entrypoint: pr-pipeline
           onExit: report-final
           arguments:
             parameters:
               - name: repository
                 value: "${REPO}"
               - name: pr-number
                 value: "${PR_NUM}"
               - name: commit-sha
                 value: "${SHA}"
               - name: image
                 value: "${PR_IMAGE}"
               - name: image-tag
                 value: "${PR_IMAGE_TAG}"
               - name: image-digest
                 value: ""
               - name: suites
                 value: "${PR_SUITES}"
               - name: variant
                 value: "${PRODUCT}"
               - name: branch
                 value: "${BRANCH}"
               - name: testsuite-branch
                 value: "${TESTSUITE_BRANCH}"
               - name: testsuite-repo
                 value: "${TESTSUITE_REPO}"
           templates:
             - name: pr-pipeline
               dag:
                 tasks:
                   - name: report-start
                     templateRef:
                       name: github-check-reporter
                       template: send
                     arguments:
                       parameters:
                         - name: repository
                           value: "{{workflow.parameters.repository}}"
                         - name: sha
                           value: "{{workflow.parameters.commit-sha}}"
                         - name: pr-number
                           value: "{{workflow.parameters.pr-number}}"
                         - name: state
                           value: in_progress
                         - name: conclusion
                           value: ""
                         - name: workflow-name
                           value: "{{workflow.name}}"
                         - name: workflow-url
                           value: "${ARGO_WORKFLOW_URL_BASE}/{{workflow.name}}"
                         - name: title
                           value: ${DISPLAY_NAME} lab validation is running
                         - name: summary
                           value: |
                             The lab admitted PR #${PR_NUM} at commit \`${SHA}\`.

                             Validation is running in Argo workflow \`{{workflow.name}}\`.
                         - name: text
                           value: ""
                         - name: started-at
                           value: ""
                         - name: completed-at
                           value: ""
                   - name: build
                     depends: "(report-start.Succeeded || report-start.Failed || report-start.Errored)"
                     when: "'{{workflow.parameters.repository}}' == 'projectbluefin/dakota'"
                     templateRef:
                       name: dakota-build-pipeline
                       template: build
                     arguments:
                       parameters:
                         - name: ref
                           value: "testing"
                         - name: commit-sha
                           value: "${SHA}"
                         - name: repo
                           value: "https://github.com/${REPO}.git"
                         - name: image-tag
                           value: "${SHA}"
                         - name: build-mode
                           value: "re"
                         - name: lock-key
                           value: "bst-build"
                   - name: qa-dakota
                     depends: "build.Succeeded"
                     when: "'{{workflow.parameters.repository}}' == 'projectbluefin/dakota'"
                     templateRef:
                       name: dakota-qa-pipeline
                       template: pipeline
                     arguments:
                       parameters:
                         - name: image
                           value: "{{workflow.parameters.image}}"
                         - name: image-tag
                           value: "{{workflow.parameters.image-tag}}"
                         - name: image-digest
                           value: "{{workflow.parameters.image-digest}}"
                         - name: suites
                           value: "{{workflow.parameters.suites}}"
                         - name: variant
                           value: "{{workflow.parameters.variant}}"
                         - name: branch
                           value: "{{workflow.parameters.branch}}"
                         - name: testsuite-branch
                           value: "{{workflow.parameters.testsuite-branch}}"
                         - name: testsuite-repo
                           value: "{{workflow.parameters.testsuite-repo}}"
                   - name: qa-bluefin
                     depends: "(report-start.Succeeded || report-start.Failed || report-start.Errored)"
                     when: "'{{workflow.parameters.repository}}' != 'projectbluefin/dakota'"
                     templateRef:
                       name: bluefin-qa-pipeline
                       template: pipeline
                     arguments:
                       parameters:
                          - name: image
                            value: "{{workflow.parameters.image}}"
                          - name: image-tag
                            value: "{{workflow.parameters.image-tag}}"
                          - name: suites
                            value: "{{workflow.parameters.suites}}"
                          - name: variant
                            value: "{{workflow.parameters.variant}}"
                          - name: branch
                            value: "{{workflow.parameters.branch}}"
                          - name: pr-number
                            value: "{{workflow.parameters.pr-number}}"
                          - name: sha
                            value: "{{workflow.parameters.commit-sha}}"
                          - name: repo
                            value: "{{workflow.parameters.repository}}"
                          - name: testsuite-branch
                            value: "{{workflow.parameters.testsuite-branch}}"
                          - name: testsuite-repo
                            value: "{{workflow.parameters.testsuite-repo}}"
             - name: report-final
               steps:
                 - - name: github-check
                     templateRef:
                       name: github-check-reporter
                       template: final
                     arguments:
                       parameters:
                         - name: repository
                           value: "{{workflow.parameters.repository}}"
                         - name: sha
                           value: "{{workflow.parameters.commit-sha}}"
                         - name: pr-number
                           value: "{{workflow.parameters.pr-number}}"
                         - name: final-status
                           value: "{{workflow.status}}"
                         - name: workflow-url
                           value: "${ARGO_WORKFLOW_URL_BASE}/{{workflow.name}}"
          EOF
            )
            WORKFLOW_URL="${ARGO_WORKFLOW_URL_BASE}/${WORKFLOW_NAME}"
            if ! dispatch_lab_check \
              "${REPO}" \
              "${SHA}" \
              "${PR_NUM}" \
              queued \
              "" \
              "${WORKFLOW_NAME}" \
              "${WORKFLOW_URL}" \
              "${DISPLAY_NAME} lab validation queued" \
              "The lab queued PR #${PR_NUM} at commit \`${SHA}\` as Argo workflow \`${WORKFLOW_NAME}\`."; then
              echo "PR #${PR_NUM} ${REPO}: failed to create queued GitHub check; deleting ${WORKFLOW_NAME} so the next poll retries" >&2
              kubectl delete workflow "${WORKFLOW_NAME}" -n argo --ignore-not-found
              return 0
            fi
            echo "PR #${PR_NUM} ${REPO}: dispatched ${WORKFLOW_NAME} and queued MergeRaptor check for ${SHA12}" >&2
           else
             kubectl create -f - <<EOF
          apiVersion: argoproj.io/v1alpha1
          kind: Workflow
          metadata:
           generateName: "${REPO_SLUG}-${PR_NUM}-${TITLE_SLUG}-"
           namespace: argo
           labels:
             bluefin.io/trigger: pr-auto
             bluefin.io/pr-number: "${PR_NUM}"
             bluefin.io/pr-sha: "${SHA12}"
          spec:
           workflowTemplateRef:
             name: ${TMPL}
           arguments:
             parameters:
               - name: sha
                 value: "${SHA}"
               - name: repo
                 value: "${REPO}"
               - name: branch
                 value: "${BRANCH}"
               - name: pr-number
                 value: "${PR_NUM}"${EXTRA_PARAMS}
          EOF
             echo "PR #${PR_NUM} ${REPO}: dispatched ${TMPL}" >&2
           fi
           (( DISPATCHED++ )) || true
          }

          # --- Pass 1: every open PR in auto-test repos ---
          for REPO in "${AUTO_REPOS[@]}"; do
           REPO_QUERY=$(jq -rn --arg q "repo:${REPO} is:pr is:open" '$q|@uri')
           PAGE=1
           while true; do
             RESULTS=$(curl -sf \
               -H "Authorization: token ${GITHUB_TOKEN}" \
               -H "Accept: application/vnd.github+json" \
               "${API}/search/issues?q=${REPO_QUERY}&per_page=30&page=${PAGE}")
             COUNT=$(echo "$RESULTS" | jq '.total_count // 0')
             ITEMS=$(echo "$RESULTS" | jq '.items | length')
             [[ "$ITEMS" -eq 0 ]] && break
             echo "Repo ${REPO}: ${COUNT} open PR(s), page ${PAGE}, ${ITEMS} items" >&2
             while read -r item; do
               PR_URL=$(echo "$item" | jq -r '.pull_request.url')
               PR=$(curl -sf \
                 -H "Authorization: token ${GITHUB_TOKEN}" \
                 -H "Accept: application/vnd.github+json" \
                 "$PR_URL")
               dispatch_pr "$PR"
             done < <(echo "$RESULTS" | jq -c '.items[]')
             [[ "$ITEMS" -lt 30 ]] && break
             (( PAGE++ ))
           done
          done

          # --- Pass 2: label-based catch-all for projectbluefin repos ---
          LABEL_QUERY=$(jq -rn --arg q "org:projectbluefin is:pr is:open label:test-on-lab" '$q|@uri')
          LABEL_RESULTS=$(curl -sf \
           -H "Authorization: token ${GITHUB_TOKEN}" \
           -H "Accept: application/vnd.github+json" \
           "${API}/search/issues?q=${LABEL_QUERY}")
          LABEL_COUNT=$(echo "$LABEL_RESULTS" | jq '.total_count // 0')
          echo "Found ${LABEL_COUNT} PR(s) with test-on-lab label" >&2
          if [[ "$LABEL_COUNT" -gt 0 ]]; then
           while read -r item; do
             PR_URL=$(echo "$item" | jq -r '.pull_request.url')
             PR=$(curl -sf \
               -H "Authorization: token ${GITHUB_TOKEN}" \
               -H "Accept: application/vnd.github+json" \
               "$PR_URL")
             dispatch_pr "$PR"
           done < <(echo "$LABEL_RESULTS" | jq -c '.items[]')
          fi