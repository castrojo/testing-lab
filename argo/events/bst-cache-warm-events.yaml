apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: bst-cache-warm
  namespace: argo
spec:
  service:
    ports:
      - port: 12000
        targetPort: 12000
  webhook:
    bst-cache-cold:
      port: "12000"
      endpoint: /bst-cache-cold
      method: POST
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: bst-cache-warm
  namespace: argo
spec:
  template:
    serviceAccountName: argo
  dependencies:
    - name: bst-cache-cold
      eventSourceName: bst-cache-warm
      eventName: bst-cache-cold
  triggers:
    - template:
        name: bst-cache-warm-submit
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: bst-cache-warm-
                namespace: argo
                labels:
                  app.kubernetes.io/component: bst-cache-warm
                  app.kubernetes.io/part-of: bluefin-test-suite
              spec:
                workflowTemplateRef:
                  name: bst-cache-warm
                arguments:
                  parameters:
                    - name: build-mode
                      value: "re"
