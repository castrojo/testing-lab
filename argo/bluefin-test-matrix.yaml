apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: bluefin-qa-matrix-
  namespace: argo
spec:
  entrypoint: matrix
  serviceAccountName: argo
  # Generous ceiling because the run-container-tests template now queues behind a
  # cross-workflow semaphore; the workflow-level deadline must outlive queue wait
  # plus the 1h per-suite test pod deadline.
  activeDeadlineSeconds: 14400
  ttlStrategy:
    secondsAfterCompletion: 3600
    secondsAfterSuccess: 3600
    secondsAfterFailure: 7200
  arguments:
    parameters:
      - name: branch
        value: "main"
  templates:
    - name: matrix
      # Each lane holds a `ghost-container-qa` slot; cap the fan-out so a manual
      # matrix run cannot monopolise the shared runner. `spec.parallelism` would
      # not reach `run-container-tests` through `templateRef`.
      parallelism: 2
      dag:
        tasks:
          - name: test-bluefin
            templateRef:
              name: run-container-tests
              template: run-container-tests
            arguments:
              parameters:
                - name: image
                  value: "ghcr.io/projectbluefin/bluefin"
                - name: image-tag
                  value: "testing"
                - name: suite
                  value: "smoke"
                - name: variant
                  value: "bluefin"
                - name: branch
                  value: "{{workflow.parameters.branch}}"
          - name: test-bluefin-lts
            templateRef:
              name: run-container-tests
              template: run-container-tests
            arguments:
              parameters:
                - name: image
                  value: "ghcr.io/projectbluefin/bluefin-lts"
                - name: image-tag
                  value: "testing"
                - name: suite
                  value: "smoke"
                - name: variant
                  value: "bluefin-lts"
                - name: branch
                  value: "{{workflow.parameters.branch}}"
