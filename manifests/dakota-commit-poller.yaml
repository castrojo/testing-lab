# Poll Dakota testing after the PR poller has had time to reserve a BST slot.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: dakota-commit-poller
  namespace: argo
  labels:
    app.kubernetes.io/component: commit-poller
    app.kubernetes.io/part-of: bluefin-test-suite
spec:
  # Suspended 2026-08-07: the poller was fire-and-forget failing every 5 min
  # on the red distributed lane and its runs steal the bst-build semaphore
  # from supervised validation runs. Re-enable after the lane is green again.
  suspend: true
  schedules:
    - "2-59/5 * * * *"
  timezone: "UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  workflowMetadata:
    labels:
      bluefin.io/bst-workload: "true"
      bluefin.io/bst-source: dakota
  workflowSpec:
    serviceAccountName: argo
    entrypoint: poll-dakota
    arguments:
      parameters:
        - name: repo
          value: projectbluefin/dakota
        - name: branch
          value: testing
        - name: state-key
          value: sha-dakota-testing
        - name: force
          value: "false"
    workflowTemplateRef:
      name: bst-commit-poller
