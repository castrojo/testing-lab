apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: amdgpu-device-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/name: amdgpu-device-plugin
    app.kubernetes.io/part-of: lab
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: amdgpu-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amdgpu-device-plugin
        app.kubernetes.io/part-of: lab
    spec:
      # Driven off Node Feature Discovery rather than a hand-applied label so
      # every node with an AMD display controller (PCI class 0380, vendor 1002)
      # advertises amd.com/gpu automatically. The previous hand-applied
      # lab.projectbluefin.io/amd-gpu label was only ever set on exo-0, which
      # left ghost's iGPU invisible to the scheduler.
      nodeSelector:
        feature.node.kubernetes.io/pci-0380_1002.present: "true"
      priorityClassName: system-node-critical
      containers:
        - name: amdgpu-device-plugin
          image: docker.io/rocm/k8s-device-plugin:latest # registry-lint-ignore: upstream ROCm device plugin, not mirrored
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: KUBELET_ROOT_DIR
              value: /var/lib/kubelet
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
            - name: sys
              mountPath: /sys
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: DirectoryOrCreate
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        - name: sys
          hostPath:
            path: /sys
            type: Directory
