# Cluster-wide Argo workflow queuing.
#
# Template-level semaphores are the only lock type that binds across ALL
# callers, including workflow-of-workflows invocations via templateRef.
#
# Keys:
#   bst-build          — Global Dakota/Cosmic/Bluefin Server BuildStream
#                        execution lane. One pipeline owns the slot; its
#                        variants still run in parallel, keeping both BuildBarn
#                        workers busy without stampeding the cache or starving
#                        lab validation.
#   bst-cache-warm     — Dedicated lane for the bst-cache-warm recovery chain.
#                        Keeps cache re-seeding from occupying the production
#                        bst-build slot while still allowing only one warmup
#                        build at a time.
#   migration-containerdisk-build — Serializes the migration workflow while it
#                        refreshes and consumes its temporary VM source disk.
#   ghost-container-qa — Cross-workflow capacity limit for the control-plane
#                        container QA runner (run-container-tests). Each pod
#                        requests 4Gi on ghost; cap concurrent runs to keep
#                        total requested memory below the 95% pressure threshold.
#                        Lowered from 8 to 6 to relieve memory pressure on ghost
#                        while preserving enough parallelism for the suite fan-out.
#                        Topology rule: this key is declared ONLY on the
#                        run-container-tests template (the leaf that consumes the
#                        runner). No orchestration template and no
#                        spec.synchronization may reference it, and every
#                        fan-out template that calls it must carry its own
#                        template-level `parallelism` — spec.parallelism is not
#                        inherited through templateRef. Enforced by
#                        scripts/check_semaphore_topology.py in `just lint`.
#                        VMs are still scheduled natively and must not use this
#                        semaphore (see docs/skills/argo-workflows/patterns.md).
#   dakota-publish      — Serializes Zot-to-GHCR Dakota publication workflows
#                        while both image lanes run independently inside one slot.
#   aurora-vm-qa        — Serializes Aurora/KDE VM soak runs with other
#                        workflows using the shared Aurora test namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-semaphores
  namespace: argo
  labels:
    app.kubernetes.io/part-of: lab
data:
  bst-build: "1"
  bst-cache-warm: "1"
  migration-containerdisk-build: "1"
  ghost-container-qa: "6"
  dakota-publish: "1"
  aurora-vm-qa: "1"
