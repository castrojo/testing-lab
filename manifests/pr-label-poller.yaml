# CronWorkflow: polls configured projectbluefin repositories every fifteen minutes.
# Dispatches at most one workflow per PR head SHA through the matching template.
# Requires: github-token secret in argo namespace (already present).
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: pr-label-poller
  namespace: argo
  labels:
    app.kubernetes.io/part-of: lab
    bluefin.io/trigger: pr-label
spec:
  suspend: false
  schedules:
    - "*/15 * * * *"
  timezone: "UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  workflowSpec:
    serviceAccountName: argo
    arguments:
      parameters:
        - name: refresh-existing
          value: "false"
    podGC:
      strategy: OnWorkflowCompletion
    ttlStrategy:
      secondsAfterSuccess: 3600
      secondsAfterFailure: 86400
    workflowTemplateRef:
      name: pr-poller
