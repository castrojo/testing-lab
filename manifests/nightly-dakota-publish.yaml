# CronWorkflow: nightly Dakota publication lane (GHCR destination, now disabled).
# GHCR is pull-only in this lab, so the schedule is suspended and the pipeline
# rejects any publication attempt. The reusable WorkflowTemplate remains
# available for manual submission once a non-GHCR destination exists.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: nightly-dakota-publish
  namespace: argo
  labels:
    app.kubernetes.io/part-of: dakota-test-suite
spec:
  # Suspended: GHCR push destinations are forbidden in this lab.
  suspend: true
  schedules:
    - "0 21 * * *"
  timezone: "UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  workflowMetadata:
    labels:
      app.kubernetes.io/part-of: dakota-test-suite
      bluefin.io/trigger: nightly
      bluefin.io/lane: ghcr-publish
  workflowSpec:
    serviceAccountName: argo
    podGC:
      strategy: OnWorkflowCompletion
    ttlStrategy:
      secondsAfterSuccess: 86400
      secondsAfterFailure: 604800
    workflowTemplateRef:
      name: dakota-publish-pipeline

