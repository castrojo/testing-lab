# Writable OCI registry at NodePort 30500 — BIB push target and candidate store.
# Replaces the unmanaged registry:2 Deployment that was running outside GitOps.
# No upstream proxy — local storage.
# GC enabled: orphaned layers reclaimed after 1h delay, checked every 24h.
# The active config keeps anonymous writes until every existing writer consumes
# zot-writer-auth. config-authenticated.json is the activation-ready policy:
# anonymous read, authenticated create/update/delete, authenticated metrics.
# ArgoCD: lab-infra syncs this
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-local-config
  namespace: local-registry
  labels:
    app.kubernetes.io/part-of: lab
data:
  config.json: |
    {
      "distSpecVersion": "1.1.0",
      "storage": {
        "rootDirectory": "/var/lib/registry",
        "gc": true,
        "gcDelay": "1h",
        "gcInterval": "24h",
        "retention": {
          "dryRun": false,
          "delay": "24h",
          "policies": [
            {
              "repositories": ["dakota", "dakota-nvidia"],
              "deleteReferrers": true,
              "deleteUntagged": true,
              "keepTags": [
                {
                  "patterns": ["^testing$"]
                },
                {
                  "patterns": ["^candidate-([0-9a-f]{40}|[0-9a-f]{64})$"],
                  "mostRecentlyPushedCount": 10
                },
                {
                  "patterns": ["^([0-9a-f]{40}|[0-9a-f]{64})$"],
                  "mostRecentlyPushedCount": 10
                }
              ]
            }
          ]
        }
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000"
      },
      "log": { "level": "info" },
      "extensions": {
        "metrics": {
          "enable": true,
          "prometheus": {
            "path": "/metrics"
          }
        }
      }
    }
  config-authenticated.json: |
      {
        "distSpecVersion": "1.1.0",
        "storage": {
          "rootDirectory": "/var/lib/registry",
          "gc": true,
          "gcDelay": "1h",
          "gcInterval": "24h",
          "retention": {
            "dryRun": false,
            "delay": "24h",
            "policies": [
              {
                "repositories": ["dakota", "dakota-nvidia"],
                "deleteReferrers": true,
                "deleteUntagged": true,
                "keepTags": [
                  {
                    "patterns": ["^testing$"]
                  },
                  {
                    "patterns": ["^candidate-([0-9a-f]{40}|[0-9a-f]{64})$"],
                    "mostRecentlyPushedCount": 10
                  },
                  {
                    "patterns": ["^([0-9a-f]{40}|[0-9a-f]{64})$"],
                    "mostRecentlyPushedCount": 10
                  }
                ]
              }
            ]
          }
        },
        "http": {
          "address": "0.0.0.0",
          "port": "5000",
          "realm": "zot",
          "auth": {
            "failDelay": 5,
            "htpasswd": {
              "path": "/etc/zot/auth/htpasswd"
            }
          },
          "accessControl": {
            "metrics": {
              "users": ["zot-metrics"]
            },
            "repositories": {
              "**": {
                "policies": [
                  {
                    "users": ["zot-writer"],
                    "actions": [
                      "read",
                      "create",
                      "update",
                      "delete",
                      "detectManifestCollision"
                    ]
                  }
                ],
                "defaultPolicy": ["read"],
                "anonymousPolicy": ["read"]
              }
            }
          }
        },
        "log": { "level": "info" },
        "extensions": {
          "metrics": {
            "enable": true,
            "prometheus": {
              "path": "/metrics"
            }
          }
        }
      }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: local-registry
  labels:
    app.kubernetes.io/part-of: lab
    app.kubernetes.io/component: registry-local
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
        app.kubernetes.io/part-of: lab
      annotations:
        lab.projectbluefin.io/config-version: metrics-v1
    spec:
      automountServiceAccountToken: false
      priorityClassName: system-cluster-critical
      nodeSelector:
        kubernetes.io/hostname: ghost
      containers:
        - name: zot
          image: ghcr.io/project-zot/zot-linux-amd64:v2.1.1
          args: ["serve", "/etc/zot/config.json"]
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: config
              mountPath: /etc/zot/config.json
              subPath: config.json
            - name: data
              mountPath: /var/lib/registry
            - name: auth
              mountPath: /etc/zot/auth
              readOnly: true
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "2", memory: "4Gi" }
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: zot-local-config
        - name: data
          hostPath:
            path: /var/mnt/ghost-data/zot-local
            type: DirectoryOrCreate
        # Activation gate: provision local-registry/zot-auth, migrate every
        # writer, then set optional=false and mount config-authenticated.json.
        - name: auth
          secret:
            secretName: zot-auth
            optional: true
            items:
              - key: htpasswd
                path: htpasswd
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: local-registry
  labels:
    app.kubernetes.io/part-of: lab
spec:
  type: NodePort
  selector:
    app: registry
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
