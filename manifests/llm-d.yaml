apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: llm-d-preempt
value: 1000000
preemptionPolicy: PreemptLowerPriority
globalDefault: false
description: "Higher scheduling priority for local LLM inference so it can preempt lower-priority work when needed."
---
apiVersion: v1
kind: Namespace
metadata:
  name: llm-d
  labels:
    app.kubernetes.io/part-of: testing-lab
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-modelserver
  namespace: llm-d
  labels:
    app.kubernetes.io/name: llm-d-modelserver
    app.kubernetes.io/part-of: testing-lab
spec:
  replicas: 0 # disabled by default; scale to 1 explicitly when needed
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-d-modelserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-d-modelserver
    spec:
      priorityClassName: llm-d-preempt
      containers:
        - name: modelserver
          image: vllm/vllm-openai-rocm:latest
          imagePullPolicy: IfNotPresent
          args:
            - --model
            - unsloth/Llama-3.2-3B-Instruct
            - --served-model-name
            - local-llm
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --tensor-parallel-size
            - "1"
            - --max-model-len
            - "4096"
            - --gpu-memory-utilization
            - "0.90"
            - --trust-remote-code
          env:
            - name: HF_HOME
              value: /root/.cache/huggingface
            - name: VLLM_LOGGING_LEVEL
              value: INFO
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              amd.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 24Gi
              amd.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: hf-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: llm-d-modelserver
  namespace: llm-d
  labels:
    app.kubernetes.io/name: llm-d-modelserver
    app.kubernetes.io/part-of: testing-lab
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: llm-d-modelserver
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30800
      protocol: TCP
