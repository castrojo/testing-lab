# CronWorkflow: polls ghcr.io/projectbluefin/bluefin-lts:testing every 10 minutes.
# This remains enabled for the actively used testing lane: the direct registry
# digest check is manifest-only, and run-qa=false prevents a QA fan-out here.
# Daily QA is scheduled by nightly-smoke-lts.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: image-poll-lts-testing
  namespace: argo
  labels:
    app.kubernetes.io/part-of: lab
    bluefin.io/trigger: digest-poll
spec:
  suspend: false
  schedules:
    - "2/10 * * * *"
  timezone: "UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  workflowSpec:
    serviceAccountName: argo
    podGC:
      strategy: OnWorkflowCompletion
    ttlStrategy:
      secondsAfterSuccess: 3600
      secondsAfterFailure: 86400
    workflowTemplateRef:
      name: image-poller
    arguments:
      parameters:
        - name: image
          value: "ghcr.io/projectbluefin/bluefin-lts"
        - name: image-tag
          value: "testing"
        - name: image-digest
          value: ""
        - name: state-key
          value: "digest-lts-testing"
        - name: suites
          value: "smoke"
        - name: image-digest
          value: ""
        - name: run-qa
          value: "false"
        - name: variant
          value: "bluefin-lts"
        - name: testsuite-repo
          value: "https://github.com/projectbluefin/testsuite"
