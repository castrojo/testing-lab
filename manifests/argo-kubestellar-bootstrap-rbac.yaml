# ServiceAccount for KubeStellar workflows (argo/workflow-templates/
# register-wec.yaml, kubestellar-smoke-test.yaml). clusteradm join installs
# the klusterlet operator: CRDs, namespaces, cluster roles, deployments —
# hub bootstrap is inherently cluster-admin. Confined to explicitly-run
# explicitly submitted KubeStellar workflows; regular workflows keep the
# scoped argo SA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubestellar-bootstrap
  namespace: argo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubestellar-bootstrap-admin
subjects:
  - kind: ServiceAccount
    name: kubestellar-bootstrap
    namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
# Argo emissary executor minimum for this SA (workflowtaskresults).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubestellar-bootstrap-executor
  namespace: argo
subjects:
  - kind: ServiceAccount
    name: kubestellar-bootstrap
    namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-default-executor
