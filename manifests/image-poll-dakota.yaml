# CronWorkflow: polls ghcr.io/projectbluefin/dakota:testing every 10 minutes.
# This remains enabled for the actively used testing lane: the direct registry
# digest check is manifest-only, and run-qa=false prevents a QA fan-out here.
# Daily QA is scheduled by nightly-dakota.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: image-poll-dakota
  namespace: argo
  labels:
    app.kubernetes.io/part-of: lab
    bluefin.io/trigger: digest-poll
spec:
  # Keep this poller active for freshness state; QA is intentionally disabled.
  suspend: false
  schedules:
    - "8/10 * * * *"
  timezone: "UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  workflowMetadata:
    labels:
      bluefin.io/evidence-contract: qa-run-v1
  workflowSpec:
    serviceAccountName: argo
    podGC:
      strategy: OnWorkflowCompletion
    ttlStrategy:
      secondsAfterSuccess: 3600
      secondsAfterFailure: 86400
    arguments:
      parameters:
        - name: image
          value: "ghcr.io/projectbluefin/dakota"
        - name: image-tag
          value: "testing"
        - name: state-key
          value: "digest-dakota-testing"
        - name: suites
          value: "smoke"
        - name: image-digest
          value: ""
        - name: run-qa
          value: "false"
        - name: variant
          value: "dakota"
        - name: testsuite-repo
          value: "https://github.com/projectbluefin/testsuite"
        - name: testsuite-branch
          value: "main"
        - name: branch
          value: "main"
    entrypoint: check-and-trigger
    templates:
      - name: check-and-trigger
        dag:
          tasks:
            - name: check-digest
              templateRef:
                name: image-poller
                template: poll-digest
              arguments:
                parameters:
                  - name: image
                    value: "{{workflow.parameters.image}}"
                  - name: image-tag
                    value: "{{workflow.parameters.image-tag}}"
                  - name: state-key
                    value: "{{workflow.parameters.state-key}}"
            - name: run-pipeline
              depends: "check-digest.Succeeded"
              when: "{{tasks.check-digest.outputs.parameters.changed}} == true && {{workflow.parameters.run-qa}} == true"
              templateRef:
                name: dakota-qa-pipeline
                template: pipeline
              arguments:
                parameters:
                  - name: image
                    value: "{{workflow.parameters.image}}"
                  - name: image-tag
                    value: "{{workflow.parameters.image-tag}}"
                  - name: image-digest
                    value: "{{tasks.check-digest.outputs.parameters.remote-digest}}"
                  - name: suites
                    value: "{{workflow.parameters.suites}}"
                  - name: variant
                    value: "{{workflow.parameters.variant}}"
                  - name: branch
                    value: "{{workflow.parameters.branch}}"
            - name: update-digest
              depends: "check-digest.Succeeded && (run-pipeline.Succeeded || run-pipeline.Skipped)"
              when: "{{tasks.check-digest.outputs.parameters.changed}} == true"
              templateRef:
                name: image-poller
                template: update-local
              arguments:
                parameters:
                  - name: state-key
                    value: "{{workflow.parameters.state-key}}"
                  - name: remote-digest
                    value: "{{tasks.check-digest.outputs.parameters.remote-digest}}"
                  - name: expected-digest
                    value: "{{tasks.check-digest.outputs.parameters.stored-digest}}"
