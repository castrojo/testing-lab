apiVersion: v1
kind: Service
metadata:
  name: ks-transport-controller
  namespace: wds1-system
  labels:
    app: ks-transport-controller
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  selector:
    name: transport-controller
  ports:
    - name: metrics
      port: 8090
      targetPort: 8090
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: status-addon-controller
  namespace: open-cluster-management
  labels:
    app: status-addon-controller
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  selector:
    app: status-controller
  ports:
    - name: metrics
      port: 9280
      targetPort: metrics
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: status-agent-controller
  namespace: open-cluster-management-agent-addon
  labels:
    app: status-agent
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  selector:
    app: status-agent
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
