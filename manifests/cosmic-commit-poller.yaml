# Poll Cosmic after the Dakota poller so both share bounded BST admission.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: cosmic-commit-poller
  namespace: argo
  labels:
    app.kubernetes.io/component: commit-poller
    app.kubernetes.io/part-of: bluefin-test-suite
spec:
  # Suspended 2026-08: cosmic (RazorfinOS-org) is not a reviewed product and
  # cold BST builds are the suspected ~1 TiB/day spike driver. Dakota/bluefin
  # PR testing builds its own images via pr-poller and is unaffected.
  # On-demand: `just force-dakota-poll` pattern / argo submit --from.
  suspend: true
  schedules:
    - "4-59/5 * * * *"
  timezone: "UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  workflowMetadata:
    labels:
      bluefin.io/bst-workload: "true"
      bluefin.io/bst-source: cosmic
  workflowSpec:
    serviceAccountName: argo
    entrypoint: poll-cosmic
    arguments:
      parameters:
        - name: repo
          value: RazorfinOS-org/cosmic-build-meta
        - name: branch
          value: main
        - name: state-key
          value: sha-cosmic-main
        - name: force
          value: "false"
    workflowTemplateRef:
      name: bst-commit-poller
