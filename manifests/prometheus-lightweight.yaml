apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-lightweight
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "10"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-lightweight
  annotations:
    argocd.argoproj.io/sync-wave: "10"
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - nodes/proxy
    verbs: ["get"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-lightweight
  annotations:
    argocd.argoproj.io/sync-wave: "10"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-lightweight
subjects:
  - kind: ServiceAccount
    name: prometheus-lightweight
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-lightweight-config
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "10"
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'kubernetes-cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          # Keep one bounded identity label. Copying every node label onto every
          # cAdvisor series multiplies NFD's 100+ hardware labels across tens of
          # thousands of container series and exhausts Prometheus memory.
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      # Buildbarn frontend/scheduler/storage/worker/bb-remote-asset all expose
      # Prometheus metrics on :9980 via global.diagnosticsHttpServer
      # (manifests/buildbarn-config.yaml common.libsonnet). Standard
      # annotation-based pod discovery — every buildbarn pod carries
      # prometheus.io/scrape: "true" and prometheus.io/port: "9980".
      - job_name: 'buildbarn'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['buildbarn']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: 'true'
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: '([^:]+)(?::\d+)?;(\d+)'
            replacement: '${1}:${2}'
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

      - job_name: 'kubestellar-kubeflex-controller-manager'
        scheme: https
        tls_config:
          insecure_skip_verify: true
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ['kubeflex-system']
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: kubeflex-controller-manager-metrics-service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: https
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance

      - job_name: 'kubestellar-controller-manager'
        scheme: https
        tls_config:
          insecure_skip_verify: true
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ['wds1-system']
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: kubestellar-controller-manager-metrics-service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance

      - job_name: 'kubestellar-transport-controller'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ['wds1-system']
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: ks-transport-controller
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance

      - job_name: 'kubestellar-status-addon-controller'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ['open-cluster-management']
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: status-addon-controller
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance

      - job_name: 'kubestellar-status-agent'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ['open-cluster-management-agent-addon']
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: status-agent-controller
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-lightweight
  namespace: kube-system
  labels:
    app: prometheus-lightweight
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-lightweight
  template:
    metadata:
      labels:
        app: prometheus-lightweight
      annotations:
        lab.projectbluefin.io/config-version: kubestellar-controller-metrics-v1
    spec:
      serviceAccountName: prometheus-lightweight
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus:v2.53.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2h
          ports:
            - containerPort: 9090
              name: web
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-lightweight-config
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-lightweight
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  ports:
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: web
  selector:
    app: prometheus-lightweight
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  ports:
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: web
  selector:
    app: prometheus-lightweight
