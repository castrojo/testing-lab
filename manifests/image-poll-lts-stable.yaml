# CronWorkflow: polls ghcr.io/projectbluefin/bluefin-lts:stable every 10 minutes.
# Triggers bluefin-qa-pipeline only when OCI digest changes vs ConfigMap state.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: image-poll-lts-stable
  namespace: argo
  labels:
    app.kubernetes.io/part-of: lab
    bluefin.io/trigger: digest-poll
spec:
  suspend: false
  schedules:
    - "6/10 * * * *"
  timezone: "UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  workflowSpec:
    serviceAccountName: argo
    podGC:
      strategy: OnWorkflowCompletion
    ttlStrategy:
      secondsAfterSuccess: 3600
      secondsAfterFailure: 86400
    workflowTemplateRef:
      name: image-poller
    arguments:
      parameters:
        - name: image
          value: "ghcr.io/projectbluefin/bluefin-lts"
        - name: image-tag
          value: "stable"
        - name: image-digest
          value: ""
        - name: state-key
          value: "digest-lts-stable"
        - name: suites
          value: "smoke,common,developer,software,system"
        - name: variant
          value: "bluefin-lts"
        - name: testsuite-repo
          value: "https://github.com/projectbluefin/testsuite"
