# CronWorkflow: polls ghcr.io/ublue-os/bluefin:latest every 3 hours.
# Triggers bluefin-qa-pipeline only when OCI digest changes vs ConfigMap state.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: image-poll-bluefin-main
  namespace: argo
  labels:
    app.kubernetes.io/part-of: lab
    bluefin.io/trigger: digest-poll
spec:
  # Suspended 2026-08: tracks ublue-os/bluefin (third-party rebuild lane) not
  # under review; QA fired on every digest change. Submit on demand via
  # `argo submit --from cronworkflow/image-poll-bluefin-main -n argo`.
  suspend: true
  schedules:
    - "12 */3 * * *"
  timezone: "UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  workflowSpec:
    serviceAccountName: argo
    podGC:
      strategy: OnWorkflowCompletion
    ttlStrategy:
      secondsAfterSuccess: 3600
      secondsAfterFailure: 86400
    workflowTemplateRef:
      name: image-poller
    arguments:
      parameters:
        - name: image
          value: "ghcr.io/ublue-os/bluefin"
        - name: image-tag
          value: "latest"
        - name: image-digest
          value: ""
        - name: state-key
          value: "digest-bluefin-main"
        - name: suites
          value: "smoke,common,developer,software,system"
        - name: variant
          value: "bluefin"
        - name: testsuite-repo
          value: "https://github.com/projectbluefin/testsuite"
